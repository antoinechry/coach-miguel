<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Miguel Русский</title>
<meta name="theme-color" content="#16221B">
<link rel="icon" href="favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&family=PT+Sans:wght@400;700&display=swap" rel="stylesheet">
<style>
/* Miguel Русский (09/11/2026) : apprendre le russe. Page autonome, chargée dans un cadre par l'app Outils de index.html.
   Écoute : synthèse vocale de l'appareil (voix russe, hors ligne). Répétition : reconnaissance vocale du navigateur si elle existe.
   La note de prononciation (Azure) viendra plus tard. Progression gardée dans localStorage « ru-progress ». */
:root{
  --bg:#EDF1EA; --surface:#F9FBF7; --surface-2:#E1E8DD; --line:#D3DBCF; --ink:#16221B; --muted:#56635A; --soft:#3E4A42;
  --accent:#2A6A5B; --accent-ink:#1E5C4D; --accent-bg:#DCEBE4; --mint:#7FC4A8;
  --warm:#C98A1A; --warm-ink:#7A4E0A; --warm-bg:#FBF1DC; --rec:#A3400F; --rec-bg:#FBE4D6;
  --blue:#2F5FA8; --blue-bg:#E3EAF6; --dark:#16221B; --dark-2:#24342A; --dark-3:#33463A; --on-dark:#F9FBF7; --on-dark-muted:#B9C7BD;
  --sign:#9A5B12; --faux:#C2410C;
  --ru:'PT Sans', 'Archivo', system-ui, -apple-system, sans-serif;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#101813; --surface:#18221C; --surface-2:#223029; --line:#2C3A32; --ink:#E8EFE9; --muted:#A3B1A7; --soft:#C3CFC6;
    --accent:#5FB59A; --accent-ink:#8FD3BC; --accent-bg:#1F3A31; --mint:#7FC4A8;
    --warm:#E2B04A; --warm-ink:#F0CB7A; --warm-bg:#3A2E14; --rec:#F08A5D; --rec-bg:#3D2318;
    --blue:#8FB2EE; --blue-bg:#1D2A40; --dark:#0B110D; --dark-2:#18241D; --dark-3:#2A3A30;
    --sign:#E0A35A; --faux:#F08A5D;
  }
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);overflow-x:clip}
body{font-family:'Archivo', system-ui, -apple-system, sans-serif;font-size:15px;line-height:1.4;-webkit-tap-highlight-color:transparent;padding-bottom:env(safe-area-inset-bottom)}
button{font:inherit;color:inherit;cursor:pointer}
a{color:var(--accent-ink)}
.ru{font-family:var(--ru)}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.top{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:8px;padding:6px 8px 6px 4px;background:var(--surface);border-bottom:1px solid var(--line);min-height:56px}
.top .back{min-height:44px;display:inline-flex;align-items:center;gap:2px;padding:0 8px;font-weight:650;background:none;border:0;color:var(--accent-ink)}
.top .back[hidden]{display:none}
.top[hidden]{display:none}
.top .back svg{width:20px;height:20px}
.top h1{flex:1;margin:0;text-align:center;font-size:17px;font-weight:750;font-stretch:106%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top h1 small{font-size:13px;font-weight:600;color:var(--muted)}
.top .side{min-width:84px;text-align:right;padding-right:8px;font-size:13px;font-weight:650;color:var(--muted)}
main{max-width:720px;margin:0 auto;padding:16px 16px 32px;display:flex;flex-direction:column;gap:14px}
.card{background:var(--surface);border-radius:20px;padding:16px}
.sub{margin:0;font-size:14px;color:var(--muted)}
.btn{min-height:48px;border-radius:12px;border:1px solid var(--line);background:transparent;font-weight:650;display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:0 16px;text-decoration:none;color:var(--ink)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#F9FBF7}
.btn svg{width:20px;height:20px}
.bar{height:8px;border-radius:4px;background:var(--surface-2);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:4px}
.ico{fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.note{display:flex;gap:10px;align-items:flex-start;background:var(--warm-bg);color:var(--warm-ink);border-radius:12px;padding:10px 12px;font-size:14px}
.note svg{flex:none;width:20px;height:20px;margin-top:1px}
.note p{margin:0}

/* Accueil */
.hello h2{margin:0;font-size:28px;font-weight:750;font-stretch:108%;line-height:1.1}
.hello p{margin:4px 0 0}
.bigtile{position:relative;border-radius:22px;padding:18px;display:flex;flex-direction:column;gap:10px;min-height:180px;text-align:left;border:1px solid var(--line);background:var(--surface);width:100%}
.bigtile.dark{background:var(--dark);color:var(--on-dark);border-color:var(--dark)}
.bigtile .glyphs{font-family:var(--ru);font-size:44px;font-weight:700;line-height:1;letter-spacing:.04em;color:var(--mint)}
.bigtile .name{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.bigtile .name b{font-family:var(--ru);font-size:26px}
.bigtile .name span{font-size:14px;color:var(--muted)}
.bigtile.dark .name span{color:var(--on-dark-muted)}
.bigtile .prog{display:flex;align-items:center;gap:10px;margin-top:auto;font-size:13px;font-weight:650}
.bigtile .prog .bar{flex:1}
.bigtile.dark .bar{background:var(--dark-3)}.bigtile.dark .bar i{background:var(--mint)}
.chips3{display:flex;gap:8px}
.chips3 span{width:44px;height:44px;border-radius:12px;display:grid;place-items:center}
.chips3 svg{width:24px;height:24px}
.offline{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);margin:0}
.offline svg{width:14px;height:14px}

/* Alphabet */
.progcard{background:var(--dark);color:var(--on-dark);border-radius:20px;padding:16px;display:flex;flex-direction:column;gap:12px}
.progcard .k{font-size:13px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--on-dark-muted);margin:0}
.progcard .big{margin:0;font-size:30px;font-weight:750;font-stretch:108%;line-height:1}
.progcard .big span{font-size:17px;font-weight:600;color:var(--on-dark-muted)}
.segs{display:grid;grid-template-columns:repeat(33,minmax(0,1fr));gap:2px}
.segs i{height:8px;border-radius:2px;background:var(--dark-3)}
.segs i.ok{background:var(--mint)}.segs i.cur{background:var(--warm)}
.nextl{display:flex;align-items:center;gap:12px;background:var(--dark-2);border-radius:14px;padding:10px 12px}
.nextl .g{font-family:var(--ru);font-size:34px;font-weight:700;line-height:1}
.nextl p{margin:0;font-size:13px;color:var(--on-dark-muted)}
.nextl p b{color:var(--on-dark);font-size:14px}
.progcard .go{min-height:48px;border-radius:12px;background:var(--mint);color:#16221B;font-weight:700;border:0}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--soft)}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend i{width:10px;height:10px;border-radius:3px}
.lgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
@media (min-width:560px){.lgrid{grid-template-columns:repeat(6,minmax(0,1fr))}}
.ltile{position:relative;min-height:80px;border-radius:16px;background:var(--surface);border:1px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:6px 2px}
.ltile.ok{background:var(--accent-bg);border-color:transparent}
.ltile.go{border:2px solid var(--warm)}
.ltile .gl{font-family:var(--ru);font-weight:700;line-height:1;display:flex;align-items:baseline;gap:2px}
.ltile .gl b{font-size:30px}.ltile .gl span{font-size:24px}
.ltile .lat{font-size:12px;font-weight:600;color:var(--muted)}
.ltile .fx{position:absolute;top:7px;left:7px;width:8px;height:8px;border-radius:4px;background:var(--faux)}
.ltile .ck{position:absolute;top:6px;right:6px;width:16px;height:16px;color:var(--accent-ink)}
.k-v{color:var(--accent)}.k-c{color:var(--ink)}.k-s{color:var(--sign)}

/* Lettre */
.glyphs2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.glyphs2 div{background:var(--bg);border-radius:16px;padding:10px 0 12px;display:flex;flex-direction:column;align-items:center;gap:2px}
.glyphs2 b{font-family:var(--ru);font-size:112px;line-height:1.05}
.glyphs2 span{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.sayrow{display:flex;align-items:center;gap:10px;margin-top:14px}
.sayrow .t{flex:1}
.sayrow .t p{margin:0}
.sayrow .t .s1{font-size:20px;font-weight:750;font-stretch:106%}
.round{width:52px;height:52px;border-radius:26px;border:0;background:var(--accent);color:#F9FBF7;display:grid;place-items:center;flex:none}
.round svg{width:24px;height:24px}
.round.alt{background:transparent;border:1px solid var(--line);color:var(--ink);font-size:13px;font-weight:700;width:auto;min-width:52px;padding:0 10px}
.glyphcard .note{margin-top:14px}
.wlist{background:var(--surface);border-radius:20px;padding:12px 12px 6px 16px}
.wlist h2{margin:0 0 6px;font-size:16px;display:flex;align-items:baseline}
.wlist h2 small{margin-left:auto;font-size:13px;font-weight:500;color:var(--muted);padding-right:4px}
.wrow{display:flex;align-items:center;gap:8px;min-height:64px;border-top:1px solid var(--surface-2)}
.wrow .w{flex:1;min-width:0}
.wrow .w p{margin:0}
.wrow .w .r{font-family:var(--ru);font-size:24px;font-weight:700;line-height:1.15}
.wrow .w .r u{color:var(--accent);text-decoration-thickness:3px;text-underline-offset:4px}
.wrow .w .f{font-size:13px;color:var(--muted)}
.ib{width:44px;height:44px;border-radius:22px;border:1px solid var(--line);background:transparent;display:grid;place-items:center;flex:none}
.ib svg{width:20px;height:20px}
.ib.mic{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.ib.live{background:var(--rec);border-color:var(--rec);color:#fff}
.res{font-size:12px;font-weight:700;border-radius:999px;padding:3px 9px;white-space:nowrap}
.res.ok{color:var(--accent-ink);background:var(--accent-bg)}
.res.ko{color:var(--warm-ink);background:var(--warm-bg)}
.res.none{color:var(--muted);border:1px dashed var(--line);font-weight:600;padding:2px 8px}
.lnav{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.lnav .btn b{font-family:var(--ru);font-size:18px}
.learned{width:100%}

/* Vocabulaire */
.tgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media (min-width:560px){.tgrid{grid-template-columns:repeat(3,minmax(0,1fr))}}
.ttile{min-height:108px;border-radius:18px;background:var(--surface);border:1px solid var(--line);padding:10px 12px;display:flex;flex-direction:column;gap:4px;text-align:left}
.ttile .h{display:flex;align-items:center;gap:8px}
.ttile .h .c{width:36px;height:36px;border-radius:10px;display:grid;place-items:center}
.ttile .h .c svg{width:20px;height:20px}
.ttile .h small{margin-left:auto;font-size:12px;font-weight:650;color:var(--muted)}
.ttile .r{font-family:var(--ru);font-size:19px;font-weight:700;line-height:1.15}
.ttile .f{font-size:12px;color:var(--muted);line-height:1.25}
.ttile .bar{height:5px;margin-top:auto}
.howto{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;background:var(--surface);border-radius:16px;padding:10px 12px}
.howto div{display:flex;align-items:center;gap:8px;font-size:13px;line-height:1.25}
.howto span{flex:none;width:32px;height:32px;border-radius:16px;display:grid;place-items:center}
.howto svg{width:18px;height:18px}
.wgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media (min-width:560px){.wgrid{grid-template-columns:repeat(3,minmax(0,1fr))}}
.wcard{position:relative;min-height:190px;border-radius:18px;background:var(--surface);border:1px solid var(--line);padding:10px;display:flex;flex-direction:column;align-items:stretch;gap:6px;text-align:left;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;touch-action:manipulation;transition:transform .1s}
.wcard .pic{height:108px;border-radius:12px;background:var(--bg);display:grid;place-items:center;font-size:58px;line-height:1;pointer-events:none}
.wcard .pic.txt{font-size:34px;font-weight:750;font-stretch:108%;color:var(--soft)}
.wcard .pic .sw{width:72px;height:72px;border-radius:36px;border:2px solid var(--line)}
.wcard .l1{display:flex;align-items:center;gap:6px;pointer-events:none}
.wcard .l1 .r{font-family:var(--ru);font-size:20px;font-weight:700;line-height:1.1;overflow-wrap:anywhere}
.wcard .l1 .res{margin-left:auto}
.wcard .f{font-size:13px;color:var(--muted);pointer-events:none}
.wcard.listen{border:3px solid var(--accent);transform:scale(.97)}
.wcard.listen .pic{background:var(--accent-bg)}
.wcard.rec{border:3px solid var(--rec)}
.wcard.rec .pic{background:var(--rec-bg)}
.badge{position:absolute;top:8px;left:8px;display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:700;color:#fff;border-radius:999px;padding:3px 9px;pointer-events:none}
.badge.l{background:var(--accent)}.badge.m{background:var(--rec)}
.badge svg{width:14px;height:14px}
.heard{position:absolute;left:8px;right:8px;top:84px;font-size:12px;font-weight:650;text-align:center;background:var(--surface);border-radius:8px;padding:4px 6px;box-shadow:0 1px 3px rgba(0,0,0,.15);pointer-events:none}
.toast{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom));transform:translateX(-50%);max-width:min(92vw,460px);background:var(--ink);color:var(--bg);border-radius:14px;padding:10px 14px;font-size:14px;z-index:20;box-shadow:0 4px 16px rgba(0,0,0,.25)}
.toast[hidden]{display:none}
</style>
</head>
<body>
<header class="top">
  <button class="back" id="back" type="button" hidden><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg><span id="backlab">Accueil</span></button>
  <h1 id="title">Miguel <span class="ru">Русский</span></h1>
  <span class="side" id="side"></span>
</header>
<main id="main"></main>
<div class="toast" id="toast" role="status" hidden></div>

<script>
'use strict';
/* ---------- Données ---------- */
// Alphabet : [majuscule, minuscule, prononciation, type (v voyelle, c consonne, s signe), faux ami, astuce, mots "russe=français"]
const LETTERS = [
 ['А','а','a','v',0,'Comme le « a » de « papa ».','мама=maman|папа=papa|да=oui|вода=eau|карта=carte'],
 ['Б','б','b','c',0,'Le б minuscule ressemble à un 6. Ne le confonds pas avec в, qui se dit « v ».','брат=frère|банк=banque|рыба=poisson|бабушка=grand-mère|обед=déjeuner'],
 ['В','в','v','c',1,'Faux ami : il ressemble au B mais se dit « v ».','вино=vin|врач=médecin|вечер=soir|Москва=Moscou|вопрос=question'],
 ['Г','г','g','c',0,'Toujours dur, comme dans « gare », jamais comme dans « girafe ».','город=ville|год=année|газета=journal|гора=montagne|нога=jambe'],
 ['Д','д','d','c',0,'Comme le « d » français.','дом=maison|друг=ami|день=jour|дочь=fille (enfant)|дорога=route'],
 ['Е','е','ié','v',0,'Se dit « ié », comme dans « pied ».','лес=forêt|небо=ciel|где=où|место=place|есть=manger'],
 ['Ё','ё','io','v',0,'Se dit « io » et porte toujours l’accent tonique.','ёлка=sapin|ёж=hérisson|мёд=miel|тётя=tante|самолёт=avion'],
 ['Ж','ж','j','c',0,'Comme le « j » de « jour ».','жена=épouse|жизнь=vie|журнал=magazine|жук=scarabée|пижама=pyjama'],
 ['З','з','z','c',0,'Comme le « z » de « zéro ». Il ressemble au chiffre 3.','зима=hiver|зуб=dent|звезда=étoile|роза=rose|завтра=demain'],
 ['И','и','i','v',0,'Se dit « i ». Il ressemble à un N à l’envers.','имя=prénom|игра=jeu|кино=cinéma|мир=paix, monde|книга=livre'],
 ['Й','й','y bref','c',0,'Un « y » très court, comme dans « paille ».','мой=mon|чай=thé|май=mai|музей=musée|йогурт=yaourt'],
 ['К','к','k','c',0,'Comme le « k » français.','кот=chat|кофе=café|молоко=lait|рука=main|кровать=lit'],
 ['Л','л','l','c',0,'Un « l » plus sombre qu’en français, langue reculée.','лампа=lampe|лето=été|луна=lune|лук=oignon|хлеб=pain'],
 ['М','м','m','c',0,'Comme le « m » français.','море=mer|мост=pont|метро=métro|музыка=musique|зима=hiver'],
 ['Н','н','n','c',1,'Faux ami : il ressemble au H mais se dit « n ».','нос=nez|нет=non|ночь=nuit|окно=fenêtre|сын=fils'],
 ['О','о','o','v',0,'« o » quand il est accentué ; sinon il sonne plutôt « a ».','он=il|сок=jus|отец=père|осень=automne|кот=chat'],
 ['П','п','p','c',0,'Comme le « p » français.','парк=parc|пиво=bière|суп=soupe|поезд=train|письмо=lettre'],
 ['Р','р','r roulé','c',1,'Faux ami : il ressemble au P mais se dit « r », roulé du bout de la langue.','рот=bouche|река=rivière|сыр=fromage|утро=matin|работа=travail'],
 ['С','с','s','c',1,'Faux ami : il ressemble au C mais se dit toujours « s ».','сад=jardin|стол=table|сумка=sac|сестра=sœur|солнце=soleil'],
 ['Т','т','t','c',0,'Comme le « t » français.','тут=ici|торт=gâteau|такси=taxi|театр=théâtre|тарелка=assiette'],
 ['У','у','ou','v',1,'Faux ami : il ressemble au Y mais se dit « ou ».','ухо=oreille|урок=leçon|стул=chaise|улица=rue|утро=matin'],
 ['Ф','ф','f','c',0,'Comme le « f » français.','фото=photo|флаг=drapeau|фильм=film|кафе=café (le lieu)|фрукты=fruits'],
 ['Х','х','kh','c',1,'Faux ami : il ressemble au X mais se dit « kh », comme la jota espagnole.','хорошо=bien|холод=froid|муха=mouche|смех=rire|ухо=oreille'],
 ['Ц','ц','ts','c',0,'Se dit « ts », comme dans « tsar ».','цирк=cirque|цена=prix|лицо=visage|отец=père|улица=rue'],
 ['Ч','ч','tch','c',0,'Se dit « tch », comme dans « tchèque ».','час=heure|чай=thé|человек=personne|врач=médecin|ночь=nuit'],
 ['Ш','ш','ch','c',0,'Un « ch » dur, langue reculée.','шапка=bonnet|школа=école|шоколад=chocolat|каша=bouillie|мышь=souris'],
 ['Щ','щ','ch long','c',0,'Un « ch » long et mouillé, comme un chuchotement.','щи=soupe aux choux|щука=brochet|ещё=encore|овощи=légumes|площадь=place (en ville)'],
 ['Ъ','ъ','dur','s',0,'Signe dur, sans son : il sépare la consonne de la voyelle qui suit.','подъезд=entrée d’immeuble|объект=objet|отъезд=départ|съезд=congrès|объяснение=explication'],
 ['Ы','ы','i dur','v',0,'Un « i » dur : recule la langue, lèvres détendues, comme si tu disais « i » en serrant un crayon entre les dents.','мы=nous|ты=tu|сыр=fromage|дым=fumée|рыба=poisson'],
 ['Ь','ь','mou','s',0,'Signe mou, sans son : il mouille la consonne d’avant.','мать=mère|соль=sel|день=jour|жизнь=vie|учитель=enseignant'],
 ['Э','э','è','v',0,'Se dit « è », comme dans « mère ».','это=c’est|эхо=écho|этаж=étage|экран=écran|поэт=poète'],
 ['Ю','ю','iou','v',0,'Se dit « iou », comme dans « you ».','юг=sud|юбка=jupe|меню=menu|люблю=j’aime|утюг=fer à repasser'],
 ['Я','я','ia','v',0,'Se dit « ia ». C’est aussi le mot « je ».','я=je|яблоко=pomme|моя=ma|имя=prénom|семья=famille']

/* ---------- Progression (localStorage) ---------- */
// { letters: { 'Б': 1 }, words: { 'брат': { ok: n, ko: n, last: 'ok'|'ko' } }, days: ['AAAA-MM-JJ', …] }
const P = (() => { try { return JSON.parse(localStorage.getItem('ru-progress')) || {}; } catch(_){ return {}; } })();
P.letters = P.letters || {}; P.words = P.words || {}; P.days = P.days || [];
function save(){ try { localStorage.setItem('ru-progress', JSON.stringify(P)); } catch(_){} }
function today(){ const d = new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function markDay(){ const t = today(); if (!P.days.includes(t)){ P.days.push(t); P.days = P.days.slice(-400); save(); } }
function streak(){
  const s = new Set(P.days); let n = 0; const d = new Date();
  if (!s.has(today())) d.setDate(d.getDate() - 1);
  for (;;){ const k = d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); if (!s.has(k)) break; n++; d.setDate(d.getDate() - 1); }
  return n;
}
const wordOk = ru => !!(P.words[ru] && P.words[ru].ok);

const lettersDone = () => LETTERS.filter(l => P.letters[l[0]]).length;
const nextLetter = () => LETTERS.findIndex(l => !P.letters[l[0]]);

/* ---------- Voix : écoute (synthèse) et répétition (reconnaissance) ---------- */
const synth = window.speechSynthesis || null;
let ruVoice = null;
function pickVoice(){
  if (!synth) return;
  const vs = synth.getVoices().filter(v => /^ru/i.test(v.lang));
  ruVoice = vs.find(v => /premium|enhanced|milena|katya|yuri/i.test(v.name)) || vs.find(v => v.localService) || vs[0] || null;
}
if (synth){ pickVoice(); try { synth.addEventListener('voiceschanged', pickVoice); } catch(_){ synth.onvoiceschanged = pickVoice; } }
let noVoiceWarned = false;
function speak(text, slow){
  return new Promise(res => {
    if (!synth){ toast('Ton appareil ne sait pas lire à voix haute.'); res(); return; }
    if (!ruVoice) pickVoice();
    if (!ruVoice && !noVoiceWarned){ noVoiceWarned = true; toast('Aucune voix russe trouvée. Sur iPhone : Réglages › Accessibilité › Contenu énoncé › Voix › Russe.'); }
    synth.cancel();
    const u = new SpeechSynthesisUtterance(text.replace(/…/g, ''));
    u.lang = 'ru-RU'; if (ruVoice) u.voice = ruVoice;
    u.rate = slow ? 0.55 : 0.85;
    let done = false; const end = () => { if (!done){ done = true; res(); } };
    u.onend = end; u.onerror = end;
    setTimeout(end, 1500 + text.length * 260 * (slow ? 1.6 : 1));
    synth.speak(u);
    markDay();
  });
}
const SR = window.SpeechRecognition || window.webkitSpeechRecognition || null;
const norm = s => String(s || '').toLowerCase().replace(/ё/g, 'е').replace(/[^а-яa-z0-9 ]/g, ' ').replace(/\s+/g, ' ').trim();
let recBusy = false;
// Écoute ce que dit Antoine et compare au mot attendu. Renvoie { ok, heard } ou null (pas de micro / pas de reconnaissance).
function listen(expected){
  return new Promise(res => {
    if (!SR){ res(null); return; }
    let r; try { r = new SR(); } catch(_){ res(null); return; }
    recBusy = true;
    r.lang = 'ru-RU'; r.interimResults = false; r.maxAlternatives = 5; r.continuous = false;
    let best = null, finished = false;
    const fin = v => { if (finished) return; finished = true; recBusy = false; try { r.stop(); } catch(_){} res(v); };
    r.onresult = e => {
      const want = norm(expected), alts = [];
      for (const rr of e.results) for (const a of rr) alts.push(a.transcript);
      const hit = alts.find(a => { const n = norm(a); return n === want || n.split(' ').includes(want) || (want.includes(' ') && n.includes(want)); });
      best = { ok: !!hit, heard: hit || alts[0] || '' };
      fin(best);
    };
    r.onerror = e => fin(e && (e.error === 'not-allowed' || e.error === 'service-not-allowed') ? { denied: true } : (best || { ok: false, heard: '' }));
    r.onend = () => fin(best || { ok: false, heard: '' });
    try { r.start(); } catch(_){ fin(null); return; }
    setTimeout(() => { try { r.stop(); } catch(_){} }, 5000);
  });
}
function record(ru, ok){
  const w = P.words[ru] = P.words[ru] || { ok: 0, ko: 0 };
  if (ok) w.ok++; else w.ko++;
  w.last = ok ? 'ok' : 'ko'; save(); markDay();
}
function resChip(ru){
  const w = P.words[ru];
  if (!w || !w.last) return '<span class="res none">–</span>';
  return w.last === 'ok' ? '<span class="res ok">✓ compris</span>' : '<span class="res ko">à revoir</span>';
}
async function repeatWord(ru, onState){
  if (!SR){ toast('Répète le mot à voix haute. La correction de ta prononciation arrive bientôt.'); return; }
  if (recBusy) return;
  onState('rec');
  const r = await listen(ru);
  if (!r){ onState(''); toast('Le micro n’est pas disponible ici.'); return; }
  if (r.denied){ onState(''); toast('Autorise le micro pour que Miguel t’écoute.'); return; }
  record(ru, r.ok);
  onState('', r);
}

/* ---------- Petites aides ---------- */
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]));
let toastT = 0;
function toast(msg){ const t = $('toast'); t.textContent = msg; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => { t.hidden = true; }, 4200); }
const ICON = {
  speak: '<svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M16.5 8.5a5 5 0 0 1 0 7"/></svg>',
  speak2: '<svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12"/></svg>',
  mic: '<svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>',
  check: '<svg class="ico" viewBox="0 0 24 24" aria-hidden="true" style="stroke-width:3"><path d="M5 12l5 5L20 7"/></svg>',
  info: '<svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 8h.01M11 12h1v5h1"/></svg>'
};
const themeIcon = (t, size) => '<svg class="ico" viewBox="0 0 24 24" aria-hidden="true" style="width:'+size+'px;height:'+size+'px"><path d="'+t.d+'"/></svg>';
function picHTML(img){
  if (/^#[0-9a-f]{6}$/i.test(img)) return '<span class="pic"><span class="sw" style="background:'+img+'"></span></span>';
  if (/^[0-9a-zа-я. ]+$/i.test(img)) return '<span class="pic txt">'+esc(img)+'</span>';
  return '<span class="pic">'+esc(img)+'</span>';
}

/* ---------- Écrans ---------- */
// Route : '' (accueil) | 'alpha' | 'l/<index>' | 'vocab' | 't/<id>'
function go(route, push){
  if (push !== false){ try { history.pushState({ r: route }, '', '#'+route); } catch(_){} }
  render(route);
}
window.addEventListener('popstate', () => render(location.hash.slice(1)));
function setTop(title, back, side){
  $('title').innerHTML = title;
  document.querySelector('.top').hidden = !back;
  $('back').hidden = !back; if (back){ $('backlab').textContent = back.label; $('back').dataset.to = back.to; }
  $('side').textContent = side || '';
}
$('back').addEventListener('click', () => go($('back').dataset.to || ''));

function render(route){
  if (synth) synth.cancel();
  const m = route.match(/^(l|t)\/(.+)$/);
  if (route === 'alpha') renderAlpha();
  else if (route === 'vocab') renderVocab();
  else if (m && m[1] === 'l' && LETTERS[+m[2]]) renderLetter(+m[2]);
  else if (m && m[1] === 't' && THEMES.find(t => t.id === m[2])) renderTheme(THEMES.find(t => t.id === m[2]));
  else renderHome();
  window.scrollTo(0, 0);
}

function renderHome(){
  setTop('Miguel <span class="ru">Русский</span>', null, '');
  const ld = lettersDone(), wd = THEMES.reduce((n, t) => n + themeDone(t), 0), st = streak();
  $('main').innerHTML =
    '<div class="hello"><h2>Miguel <span class="ru">Русский</span></h2><p class="sub"><span class="ru">Привет!</span>'+(st ? ' · série de '+st+' jour'+(st > 1 ? 's' : '') : ' · on commence ?')+'</p></div>'
    + '<button class="bigtile dark" data-go="alpha"><span class="glyphs" aria-hidden="true">Аа Бб Вв</span>'
    + '<span class="name"><b>Алфавит</b><span>l’alphabet</span></span>'
    + '<span class="prog"><span class="bar"><i style="width:'+Math.round(ld/33*100)+'%"></i></span>'+ld+' / 33 lettres</span></button>'
    + '<button class="bigtile" data-go="vocab"><span class="chips3" aria-hidden="true">'
    + '<span style="background:var(--accent-bg);color:var(--accent-ink)">'+themeIcon(THEMES[4], 24)+'</span>'
    + '<span style="background:var(--warm-bg);color:var(--warm-ink)">'+themeIcon(THEMES[9], 24)+'</span>'
    + '<span style="background:var(--blue-bg);color:var(--blue)">'+themeIcon(THEMES[14], 24)+'</span></span>'
    + '<span class="name"><b>Словарь</b><span>le vocabulaire</span></span>'
    + '<span class="prog"><span class="bar"><i style="width:'+Math.round(wd/375*100)+'%"></i></span>15 thèmes · '+wd+' / 375 mots</span></button>'
    + (SR ? '' : '<div class="note">'+ICON.info+'<p>Ici, tu peux écouter chaque lettre et chaque mot. La correction de ta prononciation arrive avec la prochaine version.</p></div>')
    + '<p class="offline">'+ICON.check+' Écoute disponible hors ligne une fois la voix russe installée.</p>';
}

function renderAlpha(){
  setTop('<span class="ru">Алфавит</span> <small>alphabet</small>', { label: 'Accueil', to: '' }, '');
  const ld = lettersDone(), nx = nextLetter();
  const segs = LETTERS.map((l, i) => '<i class="'+(P.letters[l[0]] ? 'ok' : (i === nx ? 'cur' : ''))+'"></i>').join('');
  const nxl = LETTERS[nx];
  $('main').innerHTML =
    '<section class="progcard" aria-label="Ta progression"><p class="k">Alphabet cyrillique</p>'
    + '<p class="big">'+ld+' <span>/ 33 lettres sues</span></p><div class="segs" aria-hidden="true">'+segs+'</div>'
    + (nxl ? '<div class="nextl"><span class="g" aria-hidden="true">'+nxl[0]+nxl[1]+'</span><div><p><b>À suivre : '+nxl[0]+' '+nxl[1]+'</b></p><p>'+esc(nxl[5])+'</p></div></div>'
      + '<button class="go" data-go="l/'+nx+'">'+(ld ? 'Continuer la leçon' : 'Commencer la leçon')+'</button>' : '<div class="nextl"><div><p><b>Bravo, tu connais les 33 lettres !</b></p><p>Passe au vocabulaire pour les lire en vrais mots.</p></div></div>')
    + '</section>'
    + '<div class="legend"><span><i style="background:var(--accent)"></i>Voyelle</span><span><i style="background:var(--ink)"></i>Consonne</span><span><i style="background:var(--sign)"></i>Signe muet</span><span><i style="width:8px;height:8px;border-radius:4px;background:var(--faux)"></i>Faux ami</span></div>'
    + '<div class="lgrid">'+LETTERS.map((l, i) => {
        const ok = !!P.letters[l[0]], gocls = !ok && i === nx;
        return '<button class="ltile'+(ok ? ' ok' : '')+(gocls ? ' go' : '')+'" data-go="l/'+i+'" aria-label="'+l[0]+' '+l[1]+', se dit '+esc(l[2])+(l[4] ? ', faux ami' : '')+(ok ? ', apprise' : '')+'">'
          + '<span class="gl k-'+l[3]+'"><b>'+l[0]+'</b><span>'+l[1]+'</span></span><span class="lat">« '+esc(l[2])+' »</span>'
          + (l[4] ? '<span class="fx" aria-hidden="true"></span>' : '') + (ok ? '<span class="ck">'+ICON.check+'</span>' : '') + '</button>';
      }).join('')+'</div>'
    + '<p class="sub">Touche une lettre pour l’entendre et lire ses 5 mots.</p>';
}

function hl(word, l){
  const a = l[0], b = l[1];
  return [...word].map(ch => (ch === a || ch === b) ? '<u>'+ch+'</u>' : esc(ch)).join('');
}
function renderLetter(i){
  const l = LETTERS[i], words = l[6].split('|').map(s => { const [ru, fr] = s.split('='); return { ru, fr }; });
  setTop('Lettre '+(i+1)+' / 33', { label: 'Alphabet', to: 'alpha' }, '');
  const kind = { v: 'voyelle', c: 'consonne', s: 'signe muet' }[l[3]];
  const tested = words.filter(w => P.words[w.ru] && P.words[w.ru].last).length;
  const prev = LETTERS[i-1], next = LETTERS[i+1];
  $('main').innerHTML =
    '<section class="card glyphcard" aria-label="La lettre '+l[0]+' '+l[1]+'"><div class="glyphs2">'
    + '<div><b class="k-'+l[3]+'">'+l[0]+'</b><span>Majuscule</span></div><div><b class="k-'+l[3]+'">'+l[1]+'</b><span>Minuscule</span></div></div>'
    + '<div class="sayrow"><div class="t"><p class="s1">'+(l[3] === 's' ? 'Sans son' : 'Se dit « '+esc(l[2])+' »')+'</p><p class="sub">'+kind+(l[4] ? ' · faux ami' : '')+'</p></div>'
    + '<button class="round" data-say="'+l[0]+'" aria-label="Écouter la lettre">'+ICON.speak2+'</button>'
    + '<button class="round alt" data-say="'+l[0]+'" data-slow="1" aria-label="Écouter lentement">Lent</button></div>'
    + '<div class="note">'+ICON.info+'<p>'+esc(l[5])+'</p></div></section>'
    + '<section class="wlist" aria-labelledby="h-words"><h2 id="h-words">Lis à voix haute <small>'+tested+' / 5 testés</small></h2>'
    + words.map(w => '<div class="wrow" data-row="'+esc(w.ru)+'"><div class="w"><p class="r" lang="ru">'+hl(w.ru, l)+'</p><p class="f">'+esc(w.fr)+'</p></div>'
        + '<span class="rc">'+resChip(w.ru)+'</span>'
        + '<button class="ib" data-say="'+esc(w.ru)+'" aria-label="Écouter '+esc(w.ru)+'">'+ICON.speak+'</button>'
        + '<button class="ib mic" data-rep="'+esc(w.ru)+'" aria-label="Répéter '+esc(w.ru)+'">'+ICON.mic+'</button></div>').join('')
    + '</section>'
    + '<button class="btn '+(P.letters[l[0]] ? '' : 'primary ')+'learned" data-learn="'+i+'">'+(P.letters[l[0]] ? ICON.check+' Lettre apprise · annuler' : 'Je connais cette lettre')+'</button>'
    + '<nav class="lnav" aria-label="Lettres voisines">'
    + (prev ? '<button class="btn" data-go="l/'+(i-1)+'">‹ <b>'+prev[0]+' '+prev[1]+'</b></button>' : '<span></span>')
    + (next ? '<button class="btn" data-go="l/'+(i+1)+'"><b>'+next[0]+' '+next[1]+'</b> ›</button>' : '<button class="btn" data-go="vocab">Vocabulaire ›</button>')
    + '</nav>';
}

function renderVocab(){
  setTop('<span class="ru">Словарь</span> <small>vocabulaire</small>', { label: 'Accueil', to: '' }, '');
  $('main').innerHTML = '<p class="sub">15 thèmes de 25 mots, du plus utile au plus large.</p><div class="tgrid">'
    + THEMES.map((t, i) => { const p = PAL[t.pal], n = themeDone(t);
        return '<button class="ttile" data-go="t/'+t.id+'" aria-label="'+(i+1)+'. '+esc(t.fr)+', '+n+' mots sur 25">'
          + '<span class="h"><span class="c" style="background:'+p[0]+';color:'+p[1]+'">'+themeIcon(t, 20)+'</span><small>'+n+' / 25</small></span>'
          + '<span class="r" lang="ru">'+t.ru+'</span><span class="f">'+esc(t.fr)+'</span>'
          + '<span class="bar"><i style="width:'+Math.round(n/25*100)+'%;background:'+p[2]+'"></i></span></button>'; }).join('')
    + '</div>';
}

function renderTheme(t){
  setTop('<span class="ru">'+t.ru+'</span>', { label: 'Vocabulaire', to: 'vocab' }, themeDone(t)+' / 25');
  $('main').innerHTML =
    '<div class="howto"><div><span style="background:var(--accent-bg);color:var(--accent-ink)">'+ICON.speak+'</span><p style="margin:0"><b>Appuie</b><br>tu entends le mot</p></div>'
    + '<div><span style="background:var(--rec-bg);color:var(--rec)">'+ICON.mic+'</span><p style="margin:0"><b>Relâche</b><br>'+(SR ? 'et répète-le' : 'et répète-le à voix haute')+'</p></div></div>'
    + '<div class="wgrid">'+t.words.map((w, i) => '<button class="wcard" data-card="'+i+'" aria-label="'+esc(w.ru)+', '+esc(w.fr)+'. Appuie pour écouter, relâche pour répéter.">'
        + picHTML(w.img) + '<span class="l1"><span class="r" lang="ru">'+esc(w.ru)+'</span>'+(P.words[w.ru] && P.words[w.ru].last ? resChip(w.ru) : '')+'</span>'
        + '<span class="f">'+esc(w.fr)+'</span></button>').join('')+'</div>';
  bindCards(t);
}

/* Cartes : appuyer = écouter, relâcher = répéter (le micro s'ouvre quand la voix a fini). */
function bindCards(t){
  for (const el of document.querySelectorAll('.wcard')){
    const w = t.words[+el.dataset.card];
    let speaking = null, pressed = false;
    const setState = (s, r) => {
      el.classList.remove('listen', 'rec');
      el.querySelectorAll('.badge,.heard').forEach(x => x.remove());
      if (s === 'listen'){ el.classList.add('listen'); el.insertAdjacentHTML('beforeend', '<span class="badge l">'+ICON.speak+'J’écoute</span>'); }
      if (s === 'rec'){ el.classList.add('rec'); el.insertAdjacentHTML('beforeend', '<span class="badge m">'+ICON.mic+'À toi…</span>'); }
      if (r){
        el.insertAdjacentHTML('beforeend', '<span class="heard">'+(r.ok ? '✓ Compris !' : (r.heard ? 'Entendu : « '+esc(r.heard)+' »' : 'Je n’ai rien entendu'))+'</span>');
        const l1 = el.querySelector('.l1'); l1.querySelectorAll('.res').forEach(x => x.remove()); l1.insertAdjacentHTML('beforeend', resChip(w.ru));
        $('side').textContent = themeDone(t)+' / 25';
        setTimeout(() => el.querySelectorAll('.heard').forEach(x => x.remove()), 2600);
      }
    };
    const down = e => {
      if (recBusy) return;
      if (e.type === 'pointerdown' && e.button !== 0) return;
      pressed = true;
      try { el.setPointerCapture && e.pointerId !== undefined && el.setPointerCapture(e.pointerId); } catch(_){}
      setState('listen');
      speaking = speak(w.ru);
    };
    const up = async () => {
      if (!pressed) return; pressed = false;
      await speaking; await new Promise(r => setTimeout(r, 250));
      if (!SR){ setState(''); return; }
      repeatWord(w.ru, setState);
    };
    el.addEventListener('pointerdown', down);
    el.addEventListener('pointerup', up);
    el.addEventListener('pointercancel', () => { pressed = false; setState(''); });
    el.addEventListener('contextmenu', e => e.preventDefault());
    el.addEventListener('keydown', e => { if ((e.key === 'Enter' || e.key === ' ') && !e.repeat){ e.preventDefault(); down(e); } });
    el.addEventListener('keyup', e => { if (e.key === 'Enter' || e.key === ' '){ e.preventDefault(); up(); } });
  }
}

/* Clics communs */
$('main').addEventListener('click', e => {
  const g = e.target.closest('[data-go]'); if (g){ go(g.dataset.go); return; }
  const s = e.target.closest('[data-say]'); if (s){ speak(s.dataset.say, !!s.dataset.slow); return; }
  const r = e.target.closest('[data-rep]');
  if (r){
    const ru = r.dataset.rep, row = r.closest('.wrow');
    repeatWord(ru, (st, res) => {
      r.classList.toggle('live', st === 'rec');
      r.setAttribute('aria-label', st === 'rec' ? 'Je t’écoute…' : 'Répéter '+ru);
      if (res){ row.querySelector('.rc').innerHTML = resChip(ru); toast(res.ok ? '✓ Compris : '+ru : (res.heard ? 'Entendu : « '+res.heard+' »' : 'Je n’ai rien entendu, réessaie.')); }
    });
    return;
  }
  const l = e.target.closest('[data-learn]');
  if (l){ const k = LETTERS[+l.dataset.learn][0]; if (P.letters[k]) delete P.letters[k]; else P.letters[k] = 1; save(); markDay(); renderLetter(+l.dataset.learn); }
});

render(location.hash.slice(1));
</script>
