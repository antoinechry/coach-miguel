/* Layout : carte plein écran, barre de temps ancrée en bas, commandes flottantes en haut à gauche. Palette reprise de Plan My Ride / Sillage. */
:root{
  --bg:#eef1ee; --panel:rgb(255 255 255 / .93); --panel-solid:#ffffff; --ink:#14201b; --muted:#4c5852; --line:#cdd4ce;
  --accent:#23629a; --accent-ink:#ffffff;
  --sea:#c9d7df; --land:#eceee8; --edge:#7d8c86; --halo:#ffffff;
  --flow:20 32 27; --cloud:92 104 116; --rain:#2a6fe0; --windline:#d0620a; --night:rgb(20 32 27 / .07);
  --f-display:"Archivo",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f1714; --panel:rgb(21 31 27 / .92); --panel-solid:#16201c; --ink:#eef1ec; --muted:#a3aea8; --line:#33433b;
  --accent:#8cc3ec; --accent-ink:#0f1714;
  --sea:#0b1317; --land:#19231f; --edge:#62736b; --halo:#0f1714;
  --flow:238 245 242; --cloud:222 229 236; --rain:#5aa9f5; --windline:#f0943a; --night:rgb(0 0 0 / .28);
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1714; --panel:rgb(21 31 27 / .92); --panel-solid:#16201c; --ink:#eef1ec; --muted:#a3aea8; --line:#33433b;
  --accent:#8cc3ec; --accent-ink:#0f1714;
  --sea:#0b1317; --land:#19231f; --edge:#62736b; --halo:#0f1714;
  --flow:238 245 242; --cloud:222 229 236; --rain:#5aa9f5; --windline:#f0943a; --night:rgb(0 0 0 / .28);
  color-scheme:dark}

html,body{height:100%}
body{background:var(--bg);color:var(--ink);font:14px/1.4 var(--f-display);overflow:hidden}
#app{height:100%;display:flex;flex-direction:column}
#mapWrap{position:relative;flex:1;min-height:0}
#map{position:absolute;inset:0;background:var(--sea)}
.leaflet-container{background:var(--sea);font-family:var(--f-display)}
.leaflet-control-attribution{background:var(--panel)!important;color:var(--muted)!important;font-size:10.5px}
.leaflet-control-attribution a{color:var(--muted)!important}
.leaflet-bar a{background:var(--panel-solid);color:var(--ink);border-bottom-color:var(--line)}
.leaflet-bar a:hover{background:var(--panel-solid);color:var(--accent)}
.leaflet-bar{border:1px solid var(--line)!important;box-shadow:none!important}
.leaflet-top.leaflet-right{top:env(safe-area-inset-top,0px);right:env(safe-area-inset-right,0px)}
.wx-cv,.flow-cv{pointer-events:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* commandes flottantes */
.top{position:absolute;z-index:1000;top:12px;left:max(12px,env(safe-area-inset-left,0px));right:64px;display:flex;flex-wrap:wrap;gap:8px;align-items:flex-start;pointer-events:none}
.top>*{pointer-events:auto}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.brand{padding:7px 12px 8px;display:grid;gap:1px}
.brand b{font-size:15px;font-weight:700;letter-spacing:.01em}
.src{display:flex;align-items:center;gap:6px;font:500 11px/1.2 var(--f-mono);color:var(--muted)}
.src i{width:7px;height:7px;border-radius:50%;background:#c99200;flex:none}
.src.live i{background:#2e9e5b}
.layers{display:flex;padding:3px;gap:2px}
.layers button{border:0;background:none;color:var(--ink);font:600 13px/1 var(--f-display);padding:8px 11px;border-radius:7px;cursor:pointer;display:flex;align-items:center;gap:6px}
.layers button svg{width:15px;height:15px;flex:none}
.layers button:hover{background:color-mix(in srgb,var(--accent) 12%,transparent)}
.layers button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.mlbl{align-self:center;padding:0 6px 0 9px;font:600 11px/1 var(--f-display);text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.bases{position:absolute;z-index:1000;right:max(12px,env(safe-area-inset-right,0px));bottom:28px}
.bases button{padding:7px 9px;font-size:12px}
#map.dim .basetile{filter:brightness(.5) contrast(1.15) saturate(.85)}
.tog{display:flex;align-items:center;gap:7px;padding:8px 11px;font-weight:600;font-size:13px;cursor:pointer;user-select:none}
.tog input{accent-color:var(--accent);width:15px;height:15px;margin:0}

.legend{position:absolute;z-index:1000;left:max(12px,env(safe-area-inset-left,0px));bottom:12px;padding:7px 10px 6px;width:min(300px,calc(100% - 140px))}
.legend .ttl{font:600 11px/1 var(--f-display);text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin-bottom:6px;display:flex;justify-content:space-between}
.legend .bar{height:9px;border-radius:3px;border:1px solid var(--line)}
.legend .ticks{position:relative;height:13px;font:400 10px/13px var(--f-mono);color:var(--muted);margin-top:2px}
.legend .ticks span{position:absolute;transform:translateX(-50%);white-space:nowrap}
.legend .ticks span:first-child{transform:none}
.legend .ticks span:last-child{transform:translateX(-100%)}

.city{font:600 11.5px/1 var(--f-display);color:var(--ink);white-space:nowrap;text-shadow:0 0 3px var(--halo),0 0 3px var(--halo),0 0 2px var(--halo);display:flex;align-items:center;gap:4px;pointer-events:none}
.city::before{content:"";width:5px;height:5px;border-radius:50%;background:var(--ink);box-shadow:0 0 0 1.5px var(--halo);flex:none}
.city.small{font-weight:500;font-size:10.5px;color:var(--muted)}
.city.small::before{width:4px;height:4px;background:var(--muted)}
.leaflet-div-icon.city-ic{background:none;border:0}

/* barre de temps */
.tl{flex:none;background:var(--panel-solid);border-top:1px solid var(--line);padding-block:10px max(10px,env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;gap:8px}
.tl-row{display:flex;align-items:center;gap:12px;flex-wrap:wrap;min-width:0}
#play{width:40px;height:40px;border-radius:50%;border:0;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;cursor:pointer;flex:none}
#play svg{width:16px;height:16px}
.when{display:grid;gap:1px;min-width:118px}
.when span{font-size:12px;color:var(--muted);font-weight:500}
.when strong{font:500 20px/1.05 var(--f-mono);font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.ghost{border:1px solid var(--line);background:none;color:var(--ink);font:600 12.5px/1 var(--f-display);padding:7px 10px;border-radius:7px;cursor:pointer}
.ghost:hover{border-color:var(--accent)}
.pt{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-left:auto;min-width:0}
.pt-name{font-weight:700;font-size:13px;display:flex;align-items:center;gap:6px}
.pt-name::before{content:"";width:9px;height:9px;border-radius:50%;border:2px solid var(--accent);flex:none}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{font:500 12px/1 var(--f-mono);font-variant-numeric:tabular-nums;padding:5px 7px;border-radius:6px;background:color-mix(in srgb,var(--ink) 6%,transparent);display:flex;gap:5px;align-items:center;white-space:nowrap}
.chip em{font-style:normal;color:var(--muted);font-family:var(--f-display);font-size:11px}
.chip .arr{display:inline-block;width:11px;height:11px}
#speed{border:1px solid var(--line);background:var(--panel-solid);color:var(--ink);font:500 12px var(--f-mono);border-radius:7px;padding:6px 6px}
.strip-wrap{position:relative;height:64px;cursor:ew-resize;touch-action:none}
#strip{position:absolute;inset:0;width:100%;height:100%}
#t{width:100%;margin:0;accent-color:var(--accent);height:18px}
.keys{display:flex;gap:14px;font-size:11px;color:var(--muted);flex-wrap:wrap}
.keys span{display:flex;align-items:center;gap:5px}
.keys i{display:inline-block;width:12px;height:8px;border-radius:2px}
.status{position:absolute;z-index:1000;left:50%;top:64px;transform:translateX(-50%);padding:6px 10px;font-size:12px;color:var(--muted)}

@media (max-width:640px){
  .top{right:56px}
  .layers button{padding:7px 8px;font-size:12px}
  .layers button svg{display:none}
  .brand{display:none}
  .mlbl{display:none}
  .pt{margin-left:0;width:100%}
  .legend{bottom:8px;width:calc(100% - 205px)}
  .bases{bottom:30px}
  .bases .mlbl{display:none}
}
@media (prefers-reduced-motion: reduce){*{scroll-behavior:auto}}

map.on('zoomanim', e => { if (!WX.nw) return; L.DomUtil.setTransform(WX.cv, map._latLngToNewLayerPoint(WX.nw, e.zoom, e.center), map.getZoomScale(e.zoom)); });

/* ---------- particules de vent (même principe que Plan My Ride) ---------- */
const FL = { cv: L.DomUtil.create('canvas', 'flow-cv', map.getPane('flow')), parts: [], U: null, V: null, W: null, ax: null, cell: 10, raf: 0, frames: 0, w: 0, h: 0 };
function flowField() {
  if (!S.g) return; const size = map.getSize(); FL.w = size.x; FL.h = size.y;
  FL.ax = axes(FL.cell, FL.w, FL.h); FL.U = frameField('u', FL.ax); FL.V = frameField('v', FL.ax); FL.W = frameField('ws', FL.ax);
}
function flowReset() {
  const cv = FL.cv, dpr = Math.min(2, window.devicePixelRatio || 1);
  cv.width = FL.w * dpr; cv.height = FL.h * dpr; cv.style.width = FL.w + 'px'; cv.style.height = FL.h + 'px';
  L.DomUtil.setPosition(cv, map.containerPointToLayerPoint([0, 0])); cv.getContext('2d').setTransform(dpr, 0, 0, dpr, 0, 0); cv.style.opacity = 1;
  FL.parts = Array.from({ length: clamp(Math.round(FL.w * FL.h / 520), 250, 3200) }, () => spawn({}));
  FL.frames = 0; if (!FL.raf) FL.raf = requestAnimationFrame(flowFrame);
}
const spawn = p => { p.x = Math.random() * FL.w; p.y = Math.random() * FL.h; p.age = Math.random() * 80 | 0; p.max = 45 + (Math.random() * 60 | 0); return p; };
function flowFrame() {
  FL.raf = 0; if (!S.flow || !FL.U) return;
  if (document.hidden) { FL.raf = requestAnimationFrame(flowFrame); return; }
  const c = FL.cv.getContext('2d'), w = FL.w, h = FL.h, ax = FL.ax, cols = ax.cols, [r, g, b] = TOK.flow;
  c.globalCompositeOperation = 'destination-in'; c.fillStyle = 'rgba(0,0,0,0.88)'; c.fillRect(0, 0, w, h);
  c.globalCompositeOperation = 'source-over'; c.lineCap = 'round';
  const K = .03, slow = new Path2D(), fast = new Path2D();
  for (const p of FL.parts) {
    const ci = clamp(Math.round(p.x / FL.cell), 0, cols - 1), ri = clamp(Math.round(p.y / FL.cell), 0, ax.rows - 1), k = ri * cols + ci;
    let u = FL.U[k], v = FL.V[k]; const s = FL.W[k], m = Math.hypot(u, v) || 1; u = u / m * s; v = v / m * s;
    const nx = p.x + u * K, ny = p.y - v * K;
    if (++p.age > p.max || nx < 0 || ny < 0 || nx > w || ny > h || s < .8) { spawn(p); p.age = 0; continue; }
    (s > 30 ? fast : slow).moveTo(p.x, p.y); (s > 30 ? fast : slow).lineTo(nx, ny); p.x = nx; p.y = ny;
  }
  c.strokeStyle = `rgba(${r},${g},${b},.4)`; c.lineWidth = 1.1; c.stroke(slow);
  c.strokeStyle = `rgba(${r},${g},${b},.8)`; c.lineWidth = 1.5; c.stroke(fast);
  if (reduced() && ++FL.frames > 70) return; // mouvements réduits : on fige après formation des traînées
  FL.raf = requestAnimationFrame(flowFrame);
}
function flowHide() { FL.cv.style.opacity = 0; FL.parts = []; }
function flowOn() { if (!S.flow) { flowHide(); return; } flowField(); flowReset(); }

/* ---------- légende ---------- */
function drawLegend() {
  const Ly = LAYERS[S.layer], pos = v => clamp(Ly.tf(v), 0, 1) * 100;
  const css = (s) => `rgba(${(typeof s[1] === 'string' ? hex(s[1]) : s[1]).join(',')},${Math.min(1, s[2] + .25)}) ${pos(s[0]).toFixed(1)}%`;
  const fmt = v => (Math.abs(v) < 1 && v !== 0 ? v.toString().replace('.', ',') : Math.round(v));
  $('#legend').innerHTML = `<div class="ttl"><span>${Ly.name}</span><span>${Ly.unit}</span></div><div class="bar" style="background:linear-gradient(90deg,${Ly.stops.map(css).join(',')})"></div>` +
    `<div class="ticks">${Ly.ticks.map(t => `<span style="left:${pos(t)}%">${fmt(t)}</span>`).join('')}</div>`;
}

/* ---------- temps & frise du point ---------- */
const DF = new Intl.DateTimeFormat('fr-FR', { weekday: 'short', day: 'numeric', month: 'short' }), HF = new Intl.DateTimeFormat('fr-FR', { hour: '2-digit', minute: '2-digit' });
const COMPASS = ['N', 'NE', 'E', 'SE', 'S', 'SO', 'O', 'NO'];
function solarElev(lat, lon, ms) {
  const d = ms / 864e5 - 10957.5, g = (357.529 + .98560028 * d) * RAD, q = 280.459 + .98564736 * d;
  const Lm = (q + 1.915 * Math.sin(g) + .02 * Math.sin(2 * g)) * RAD, e = (23.439 - 3.6e-7 * d) * RAD;
  const dec = Math.asin(Math.sin(e) * Math.sin(Lm)), RA = Math.atan2(Math.cos(e) * Math.sin(Lm), Math.cos(Lm));
  const H = ((18.697374558 + 24.06570982441908 * d) % 24) * 15 * RAD + lon * RAD - RA;
  return Math.asin(Math.sin(lat * RAD) * Math.sin(dec) + Math.cos(lat * RAD) * Math.cos(dec) * Math.cos(H)) / RAD;
}
function computeSeries() {
  const f = sampler(S.g), n = S.g.n, s = { pr: new Float32Array(n), ws: new Float32Array(n), cc: new Float32Array(n), night: new Uint8Array(n) };
  for (let h = 0; h < n; h++) { s.pr[h] = f('pr', S.pt.lat, S.pt.lon, h); s.ws[h] = f('ws', S.pt.lat, S.pt.lon, h); s.cc[h] = f('cc', S.pt.lat, S.pt.lon, h);
    s.night[h] = solarElev(S.pt.lat, S.pt.lon, (S.g.t0 + h * 3600) * 1000 + 1800e3) < -.83 ? 1 : 0; }
  S.series = s;
}
const strip = $('#strip'), INSET = 8;
function xOf(ms, w) { const a = startMs(), b = endMs(); return INSET + (ms - a) / (b - a) * (w - 2 * INSET); }
function drawStrip() {
  if (!S.g || !S.series) return;
  const r = strip.getBoundingClientRect(), dpr = Math.min(2, window.devicePixelRatio || 1), w = r.width, h = r.height;
  strip.width = w * dpr; strip.height = h * dpr; const c = strip.getContext('2d'); c.setTransform(dpr, 0, 0, dpr, 0, 0); c.clearRect(0, 0, w, h);
  const s = S.series, g = S.g, a = startMs(), b = endMs(), h0 = Math.round((a / 1000 - g.t0) / 3600), h1 = g.n - 1, bw = (w - 2 * INSET) / Math.max(1, h1 - h0);
  const top = 14, bot = h - 2, ph = bot - top;
  for (let k = h0; k <= h1; k++) { const x = xOf((g.t0 + k * 3600) * 1000, w);
    if (s.night[k]) { c.fillStyle = TOK.night; c.fillRect(x - bw / 2, top, bw + .5, ph); }
    c.fillStyle = `rgba(${TOK.cloud.join(',')},${(s.cc[k] / 100 * .5).toFixed(3)})`; c.fillRect(x - bw / 2, top, bw + .5, 5); }
  // jours
  c.font = '600 10.5px Archivo, system-ui, sans-serif'; c.textBaseline = 'top';
  for (let k = h0; k <= h1; k++) { const ms = (g.t0 + k * 3600) * 1000, dt = new Date(ms); if (dt.getHours() !== 0 && k !== h0) continue;
    const x = xOf(ms, w); if (k !== h0) { c.fillStyle = TOK.line; c.fillRect(Math.round(x), 0, 1, h); }
    const nextMid = xOf(ms + (24 - dt.getHours()) * HOUR, w);
    if (nextMid - x > 70 || k !== h0) { c.fillStyle = TOK.muted; c.fillText(DF.format(dt), x + 4, 0); } }
  // pluie
  const pmax = Math.max(2, ...s.pr.slice(h0)); c.fillStyle = TOK.rain;
  for (let k = h0; k <= h1; k++) if (s.pr[k] >= .05) { const x = xOf((g.t0 + k * 3600) * 1000, w), bh = Math.max(1.5, s.pr[k] / pmax * (ph - 8)); c.fillRect(x - bw * .36, bot - bh, Math.max(1, bw * .72), bh); }
  // vent
  const wmax = Math.max(40, ...s.ws.slice(h0)); c.strokeStyle = TOK.wind; c.lineWidth = 1.8; c.lineJoin = 'round'; c.beginPath();
  for (let k = h0; k <= h1; k++) { const x = xOf((g.t0 + k * 3600) * 1000, w), y = bot - s.ws[k] / wmax * (ph - 8); k === h0 ? c.moveTo(x, y) : c.lineTo(x, y); } c.stroke();
  $('#scale').textContent = `Échelle de la frise : pluie jusqu'à ${pmax.toFixed(1).replace('.', ',')} mm/h · vent jusqu'à ${Math.round(wmax)} km/h`;
  // curseur
  const xc = xOf(S.tMs, w); c.fillStyle = TOK.accent; c.fillRect(xc - 1, 0, 2, h);
  c.beginPath(); c.moveTo(xc - 5, 0); c.lineTo(xc + 5, 0); c.lineTo(xc, 6); c.fill();
}
function arrowSvg(u, v) { const deg = Math.atan2(u, v) / RAD; return `<svg class="arr" viewBox="-6 -6 12 12" style="transform:rotate(${deg}deg)"><path d="M0-5L3.5 3.5 0 1.5-3.5 3.5z" fill="currentColor"/></svg>`; }
function updateReadout() {
  const f = sampler(S.g), x = th(), p = S.pt, u = f('u', p.lat, p.lon, x), v = f('v', p.lat, p.lon, x), ws = f('ws', p.lat, p.lon, x), gu = f('gust', p.lat, p.lon, x);
  const from = COMPASS[Math.round(((Math.atan2(-u, -v) / RAD + 360) % 360) / 45) % 8], pr = f('pr', p.lat, p.lon, x), cc = f('cc', p.lat, p.lon, x), t2 = f('t2', p.lat, p.lon, x);
  const n1 = v => v.toFixed(1).replace('.', ',');
  $('#ptVals').innerHTML = `<span class="chip">${arrowSvg(u, v)}${Math.round(ws)} <em>km/h ${from}</em></span><span class="chip"><em>rafales</em> ${Math.round(gu)}</span>` +
    `<span class="chip">${pr < .05 ? '0' : n1(pr)} <em>mm/h</em></span><span class="chip">${Math.round(cc)} <em>% nuages</em></span><span class="chip">${n1(t2)} <em>°C</em></span>`;
  const dt = new Date(S.tMs); $('#whenDay').textContent = DF.format(dt) + (Math.abs(S.tMs - Date.now()) < 1800e3 ? ' · maintenant' : '');
  $('#whenHour').textContent = HF.format(new Date(Math.round(S.tMs / 600e3) * 600e3));
}
function syncRange() { const r = $('#t'); r.max = Math.round((endMs() - startMs()) / HOUR); r.value = Math.round((S.tMs - startMs()) / HOUR); }
function setTime(ms, fromRange) {
  S.tMs = clamp(ms, startMs(), endMs()); if (!fromRange) syncRange();
  queueRaster(); if (S.flow && FL.ax) { FL.U = frameField('u', FL.ax); FL.V = frameField('v', FL.ax); FL.W = frameField('ws', FL.ax); if (!FL.raf) { FL.frames = 0; FL.raf = requestAnimationFrame(flowFrame); } }
  updateReadout(); drawStrip();
}
function setPoint(lat, lon, name) {
  S.pt = { lat, lon, name: name || `${lat.toFixed(2).replace('.', ',')}° N, ${lon.toFixed(2).replace('.', ',')}° E` };
  $('#ptName').textContent = S.pt.name; drawPt(); computeSeries(); updateReadout(); drawStrip();
}
function nearestCity(ll) { let best = null, bd = 1e9; for (const [n, la, lo] of CITIES) { const d = map.distance(ll, [la, lo]); if (d < bd) { bd = d; best = n; } } return bd < 6000 ? best : null; }

/* ---------- lecture ---------- */
let last = 0;
function playLoop(ts) {
  if (!S.playing) return;
  const dt = last ? Math.min(.1, (ts - last) / 1000) : 0; last = ts;
  let t = S.tMs + dt * S.speed * HOUR * 1.5; if (t > endMs()) t = startMs();
  setTime(t); requestAnimationFrame(playLoop);
}
function setPlaying(on) {
  S.playing = on; last = 0;
  $('#play').setAttribute('aria-label', on ? "Mettre l'animation en pause" : "Lancer l'animation");
  $('#playIc').innerHTML = on ? '<path d="M4 2.5h3v11H4zM9 2.5h3v11H9z"/>' : '<path d="M4 2.5v11l9-5.5z"/>';
  if (on) requestAnimationFrame(playLoop); else setTime(Math.round(S.tMs / HOUR) * HOUR);
}

/* ---------- événements ---------- */
document.querySelectorAll('[data-layer]').forEach(b => b.addEventListener('click', () => {
  S.layer = b.dataset.layer; document.querySelectorAll('[data-layer]').forEach(x => x.setAttribute('aria-pressed', x === b)); drawLegend(); queueRaster();
}));
document.querySelectorAll('[data-base]').forEach(b => { b.setAttribute('aria-pressed', b.dataset.base === S.base); b.addEventListener('click', () => {
  S.base = b.dataset.base; try { localStorage.setItem('mm-base', S.base); } catch (e) { }
  document.querySelectorAll('[data-base]').forEach(x => x.setAttribute('aria-pressed', x === b)); tryTiles(); }); });
document.querySelectorAll('[data-model]').forEach(b => b.addEventListener('click', async () => {
  const prev = S.model, next = b.dataset.model; if (next === prev || fetching) return;
  const st = $('#status'); st.textContent = 'Chargement ' + MODELS[next].label + '…'; st.hidden = false; fetching = true;
  const mark = m => document.querySelectorAll('[data-model]').forEach(x => x.setAttribute('aria-pressed', x.dataset.model === m));
  mark(next); S.model = next;
  try {
    if (S.g.demo) { await new Promise(r => setTimeout(r, 40)); useGrid(demoGrid(next)); }
    else useGrid(await liveGrid(map.getBounds(), next));
    st.hidden = true;
  } catch (e) { S.model = prev; mark(prev); st.textContent = MODELS[next].label + ' indisponible pour cette zone'; setTimeout(() => st.hidden = true, 3500); }
  finally { fetching = false; }
}));
$('#flowOn').addEventListener('change', e => { S.flow = e.target.checked; flowOn(); });
$('#t').addEventListener('input', e => { if (S.playing) setPlaying(false); setTime(startMs() + e.target.value * HOUR, true); });
$('#play').addEventListener('click', () => setPlaying(!S.playing));
$('#nowBtn').addEventListener('click', () => { setPlaying(false); setTime(Math.floor(Date.now() / HOUR) * HOUR); });
$('#speed').addEventListener('change', e => { S.speed = +e.target.value; });
document.addEventListener('keydown', e => { if (e.code === 'Space' && !/INPUT|SELECT|BUTTON/.test(document.activeElement.tagName)) { e.preventDefault(); setPlaying(!S.playing); } });
const sw = $('#stripWrap');
const scrub = e => { const r = strip.getBoundingClientRect(), f = clamp((e.clientX - r.left - INSET) / (r.width - 2 * INSET), 0, 1); setTime(Math.round((startMs() + f * (endMs() - startMs())) / HOUR) * HOUR); };
sw.addEventListener('pointerdown', e => { if (S.playing) setPlaying(false); sw.setPointerCapture(e.pointerId); scrub(e); });
sw.addEventListener('pointermove', e => { if (sw.hasPointerCapture(e.pointerId)) scrub(e); });
map.on('click', e => setPoint(e.latlng.lat, e.latlng.lng, nearestCity(e.latlng)));
map.on('move', queueRaster);
map.on('movestart zoomstart', flowHide);
map.on('zoomend', drawCities);
map.on('moveend resize', () => { queueRaster(); if (S.flow) flowOn(); maybeRefetch(); });
new ResizeObserver(() => drawStrip()).observe(sw);
const onTheme = () => { readTokens(); drawBase(); drawPt(); drawLegend(); queueRaster(); drawStrip(); tryTiles(); };
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', onTheme);
new MutationObserver(onTheme).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });

/* ---------- source des données ---------- */
function setSource(g) {
  const live = !g.demo, M0 = MODELS[g.model]; $('#src').classList.toggle('live', live);
  const sw = g.switchH >= 0 && M0.fb ? ` → ${M0.fb} dès ${DF.format(new Date((g.t0 + g.switchH * 3600) * 1000))} ${HF.format(new Date((g.t0 + g.switchH * 3600) * 1000))}` : '';
  $('#srcTxt').textContent = live ? (g.model === 'auto' ? 'Open-Meteo auto' : M0.label) + sw + ' · ' + HF.format(new Date(g.at)) : 'Aperçu · ' + (g.model === 'auto' ? 'données simulées' : M0.label + ' simulé');
  $('#src').title = live ? 'Prévisions Open-Meteo' + (g.model === 'auto' ? ' (meilleur modèle disponible pour la zone)' : ' · modèle ' + M0.label + (M0.fb ? ', puis ' + M0.fb + ' au-delà de son échéance ou hors de son domaine' : '')) : "Pas d'accès au réseau ici : un passage de front fictif est simulé. Sur GitHub Pages, la page charge les vraies prévisions.";
  if (live) map.attributionControl.addAttribution('Météo <a href="https://open-meteo.com">Open-Meteo</a>');
}
function useGrid(g) { S.g = g; setSource(g); setTime(S.tMs); computeSeries(); updateReadout(); drawStrip(); queueRaster(); if (S.flow) flowOn(); }
async function maybeRefetch() {
  if (!S.g || S.g.demo || fetching) return;
  const b = map.getBounds(), g = S.g, inside = b.getSouth() >= g.lat0 && b.getNorth() <= g.lat1 && b.getWest() >= g.lon0 && b.getEast() <= g.lon1;
  const wrongModel = g.model !== S.model, tooCoarse = (g.lat1 - g.lat0) > (b.getNorth() - b.getSouth()) * 4, stale = Date.now() - g.at > 3 * HOUR;
  if (inside && !tooCoarse && !stale && !wrongModel) return;
  fetching = true; const st = $('#status'); st.textContent = 'Chargement des prévisions…'; st.hidden = false;
  try { useGrid(await liveGrid(b, S.model)); st.hidden = true; } catch (e) { st.textContent = 'Prévisions indisponibles pour cette zone'; setTimeout(() => st.hidden = true, 3000); } finally { fetching = false; }
}

/* ---------- démarrage ---------- */
readTokens(); drawBase(); drawCities(); drawPt(); drawLegend(); tryTiles();
(async () => {
  let g = null;
  try { g = await liveGrid(map.getBounds(), S.model); } catch (e) { g = demoGrid(S.model); map.setMaxBounds([[g.lat0, g.lon0], [g.lat1, g.lon1]]); }
  useGrid(g); setTime(Math.floor(Date.now() / HOUR) * HOUR);
})();
})();
</script>
