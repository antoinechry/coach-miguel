<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Miguel Muscu</title>
<meta name="theme-color" content="#16221B">
<link rel="icon" href="favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&display=swap" rel="stylesheet">
<style>
/* Miguel Muscu (10/11/2026) : renforcement musculaire au poids de corps, à la maison (abdos, gainage, haut du corps).
   Page autonome chargée dans un cadre par l'app Outils de index.html. Séances guidées (minuteur, bips, voix française de l'appareil),
   bibliothèque d'exercices (bonhomme animé), séances perso, suivi. Tout est gardé dans localStorage « muscu-v1 », sur l'appareil. */
:root{
  --bg:#EDF1EA; --surface:#F9FBF7; --surface-2:#E1E8DD; --line:#D3DBCF; --ink:#16221B; --muted:#56635A; --soft:#3E4A42;
  --accent:#2A6A5B; --accent-ink:#1E5C4D; --accent-bg:#DCEBE4; --mint:#7FC4A8;
  --warm:#C98A1A; --warm-ink:#7A4E0A; --warm-bg:#FBF1DC; --rec:#A3400F; --rec-bg:#FBE4D6;
  --blue:#2F5FA8; --blue-bg:#E3EAF6; --vio:#5E4B9A; --vio-bg:#ECE8F6;
  --dark:#16221B; --dark-2:#24342A; --dark-3:#33463A; --on-dark:#F9FBF7; --on-dark-muted:#B9C7BD;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#101813; --surface:#18221C; --surface-2:#223029; --line:#2C3A32; --ink:#E8EFE9; --muted:#A3B1A7; --soft:#C3CFC6;
    --accent:#5FB59A; --accent-ink:#8FD3BC; --accent-bg:#1F3A31;
    --warm:#E2B04A; --warm-ink:#F0CB7A; --warm-bg:#3A2E14; --rec:#F08A5D; --rec-bg:#3D2318;
    --blue:#8FB2EE; --blue-bg:#1D2A40; --vio:#B4A5E6; --vio-bg:#2A2440;
    --dark:#0B110D; --dark-2:#18241D; --dark-3:#2A3A30;
  }
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);overflow-x:clip}
body{font-family:'Archivo', system-ui, -apple-system, sans-serif;font-size:15px;line-height:1.4;-webkit-tap-highlight-color:transparent;padding-bottom:env(safe-area-inset-bottom)}
button{font:inherit;color:inherit;cursor:pointer}
input{font:inherit;color:inherit;font-size:16px}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.ico{fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.top{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:8px;padding:6px 8px 6px 4px;background:var(--surface);border-bottom:1px solid var(--line);min-height:56px}
.top[hidden]{display:none}
.top .back{min-height:44px;display:inline-flex;align-items:center;gap:2px;padding:0 8px;font-weight:650;background:none;border:0;color:var(--accent-ink)}
.top .back svg{width:20px;height:20px}
.top h1{flex:1;margin:0;text-align:center;font-size:17px;font-weight:750;font-stretch:106%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .side{min-width:84px;text-align:right;padding-right:8px;font-size:13px;font-weight:650;color:var(--muted)}
main{max-width:720px;margin:0 auto;padding:16px 16px 32px;display:flex;flex-direction:column;gap:14px}
.card{background:var(--surface);border-radius:20px;padding:16px}
.card h2,.sec{margin:0;font-size:16px;font-weight:750}
.sec{margin-top:6px;display:flex;align-items:baseline;gap:8px}
.sec small{margin-left:auto;font-size:13px;font-weight:500;color:var(--muted)}
.sub{margin:0;font-size:14px;color:var(--muted)}
.btn{min-height:48px;border-radius:12px;border:1px solid var(--line);background:transparent;font-weight:650;display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:0 16px;color:var(--ink)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#F9FBF7}
.btn.danger{color:var(--rec);border-color:var(--rec)}
.btn.wide{width:100%}
.btn svg{width:20px;height:20px}
.btn:disabled{opacity:.45}
.row2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.ib{width:44px;height:44px;border-radius:22px;border:1px solid var(--line);background:transparent;display:grid;place-items:center;flex:none}
.ib svg{width:20px;height:20px}
.ib:disabled{opacity:.35}
.pill{font-size:12px;font-weight:700;border-radius:999px;padding:3px 9px;white-space:nowrap;background:var(--surface-2);color:var(--soft)}
.z-abdos{background:var(--warm-bg);color:var(--warm-ink)}
.z-gainage{background:var(--accent-bg);color:var(--accent-ink)}
.z-pecs{background:var(--rec-bg);color:var(--rec)}
.z-epaules{background:var(--vio-bg);color:var(--vio)}
.z-dos{background:var(--blue-bg);color:var(--blue)}
.note{display:flex;gap:10px;align-items:flex-start;background:var(--warm-bg);color:var(--warm-ink);border-radius:12px;padding:10px 12px;font-size:14px}
.note svg{flex:none;width:20px;height:20px;margin-top:1px}
.note p{margin:0}
.toast{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom));transform:translateX(-50%);max-width:min(92vw,460px);background:var(--ink);color:var(--bg);border-radius:14px;padding:10px 14px;font-size:14px;z-index:30;box-shadow:0 4px 16px rgba(0,0,0,.25)}
.toast[hidden]{display:none}

/* Figure (bonhomme) */
.fig{display:block;width:100%;height:auto}
.fig .gd{stroke:var(--line);stroke-width:2}
.fig .pr{stroke:var(--muted);stroke-width:3;fill:none;stroke-linecap:round}
.fig .lb{stroke:var(--ink);stroke-width:5.5;stroke-linecap:round}
.fig .hd{fill:var(--ink)}

/* Accueil */
.hello h2{margin:0;font-size:28px;font-weight:750;font-stretch:108%;line-height:1.1}
.hello p{margin:4px 0 0}
.hero{background:var(--dark);color:var(--on-dark);border-radius:22px;padding:16px;display:flex;flex-direction:column;gap:12px}
.hero .k{margin:0;font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--on-dark-muted)}
.hero .t{margin:0;font-size:22px;font-weight:750;font-stretch:106%;line-height:1.15}
.hero .m{margin:0;font-size:14px;color:var(--on-dark-muted)}
.hero .figs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.hero .figs span{background:var(--dark-2);border-radius:12px;padding:4px}
.hero .fig .lb{stroke:var(--on-dark)}.hero .fig .hd{fill:var(--on-dark)}.hero .fig .gd{stroke:var(--dark-3)}.hero .fig .pr{stroke:var(--on-dark-muted)}
.hero .go{min-height:52px;border-radius:12px;background:var(--mint);color:#16221B;font-weight:750;border:0;font-size:16px;display:flex;align-items:center;justify-content:center;gap:8px}
.hero .go svg{width:20px;height:20px}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.stat{background:var(--surface);border-radius:16px;padding:12px}
.stat b{display:block;font-size:24px;font-weight:750;font-stretch:108%;line-height:1.1}
.stat span{font-size:12px;color:var(--muted)}
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.tile{min-height:108px;border-radius:18px;border:1px solid var(--line);background:var(--surface);display:flex;flex-direction:column;align-items:flex-start;justify-content:space-between;gap:8px;padding:12px;text-align:left}
.tile .i{width:40px;height:40px;border-radius:12px;display:grid;place-items:center}
.tile .i svg{width:22px;height:22px}
.tile b{font-size:15px}
.tile small{display:block;font-size:12px;color:var(--muted);font-weight:500}

/* Listes de séances */
.slist{display:flex;flex-direction:column;gap:8px}
.scard{display:flex;align-items:center;gap:12px;background:var(--surface);border-radius:18px;padding:12px;border:0;text-align:left;width:100%}
.scard .ph{width:72px;flex:none;background:var(--bg);border-radius:12px;padding:2px}
.scard .tx{flex:1;min-width:0}
.scard .tx b{display:block;font-size:16px;font-weight:700}
.scard .tx span{display:block;font-size:13px;color:var(--muted)}
.scard .ch{width:20px;height:20px;color:var(--muted);flex:none}
.lvl{display:inline-flex;gap:3px;vertical-align:middle;margin-left:4px}
.lvl i{width:6px;height:10px;border-radius:2px;background:var(--line)}
.lvl i.on{background:var(--accent)}
.empty{background:var(--surface);border:1px dashed var(--line);border-radius:18px;padding:16px;text-align:center;color:var(--muted);font-size:14px}

/* Détail séance */
.shead{display:flex;flex-direction:column;gap:6px}
.shead h2{margin:0;font-size:24px;font-weight:750;font-stretch:106%;line-height:1.15}
.facts{display:flex;flex-wrap:wrap;gap:6px}
.facts span{font-size:13px;font-weight:650;background:var(--surface);border-radius:999px;padding:5px 11px}
.ilist{background:var(--surface);border-radius:20px;padding:4px 12px}
.irow{display:flex;align-items:center;gap:10px;min-height:68px;border-top:1px solid var(--surface-2);padding:4px 0}
.irow:first-child{border-top:0}
.irow .ph{width:64px;flex:none}
.irow .tx{flex:1;min-width:0}
.irow .tx b{display:block;font-size:15px}
.irow .tx span{font-size:13px;color:var(--muted)}
.irow button.tx{background:none;border:0;padding:0;text-align:left}
.step{display:flex;align-items:center;gap:4px}
.step b{min-width:46px;text-align:center;font-size:15px}
.step .ib{width:36px;height:36px}
.step .ib svg{width:16px;height:16px}

/* Bibliothèque */
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;min-height:36px;border-radius:999px;border:1px solid var(--line);background:transparent;padding:0 14px;font-size:14px;font-weight:650}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.xgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
@media (min-width:560px){.xgrid{grid-template-columns:repeat(3,minmax(0,1fr))}}
.xcard{background:var(--surface);border-radius:16px;border:0;padding:8px 8px 10px;display:flex;flex-direction:column;gap:4px;text-align:left}
.xcard .ph{background:var(--bg);border-radius:10px}
.xcard b{font-size:14px;line-height:1.2}
.xcard .pill{align-self:flex-start;font-size:11px;padding:2px 7px}
.xbig{background:var(--surface);border-radius:20px;padding:10px}
.xbig .ph{background:var(--bg);border-radius:14px;padding:6px}
.xinfo h2{margin:0;font-size:24px;font-weight:750;font-stretch:106%}
.xinfo p{margin:4px 0 0}
.blist{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:8px}
.blist li{display:flex;gap:10px;font-size:15px}
.blist li i{flex:none;width:24px;height:24px;border-radius:12px;display:grid;place-items:center;font-style:normal;font-size:13px;font-weight:750;background:var(--accent-bg);color:var(--accent-ink)}
.blist.bad li i{background:var(--rec-bg);color:var(--rec)}
.var{display:flex;align-items:center;gap:10px;background:var(--bg);border-radius:14px;padding:6px 10px 6px 6px;border:0;width:100%;text-align:left;margin-top:8px}
.var .ph{width:64px;flex:none;background:var(--surface);border-radius:10px}
.var span{flex:1;font-size:14px}
.var small{display:block;font-size:12px;color:var(--muted);font-weight:650;text-transform:uppercase;letter-spacing:.05em}

/* Lecteur de séance */
body.playing main{max-width:560px;min-height:calc(100dvh - 56px);padding-top:10px}
.play{display:flex;flex-direction:column;gap:10px;flex:1}
.pmeta{display:flex;justify-content:space-between;font-size:13px;font-weight:650;color:var(--muted)}
.pbar{height:6px;border-radius:3px;background:var(--surface-2);overflow:hidden}
.pbar i{display:block;height:100%;background:var(--accent);transition:width .3s}
.pstage{background:var(--surface);border-radius:22px;padding:14px;display:flex;flex-direction:column;align-items:center;gap:10px;flex:1;justify-content:center}
.pstage.rest{background:var(--dark);color:var(--on-dark)}
.pstage .ph{width:min(100%,360px)}
.pkind{margin:0;font-size:13px;font-weight:750;letter-spacing:.08em;text-transform:uppercase;color:var(--accent-ink)}
.rest .pkind{color:var(--mint)}
.pname{margin:0;font-size:26px;font-weight:750;font-stretch:106%;text-align:center;line-height:1.15}
.phint{margin:0;font-size:14px;color:var(--muted);text-align:center;max-width:36ch}
.rest .phint{color:var(--on-dark-muted)}
.ring{position:relative;width:min(56vw,210px);aspect-ratio:1}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:9}
.ring .bgc{stroke:var(--surface-2)}
.rest .ring .bgc{stroke:var(--dark-3)}
.ring .fgc{stroke:var(--accent);stroke-linecap:round;transition:stroke-dashoffset .25s linear}
.rest .ring .fgc{stroke:var(--mint)}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font-size:54px;font-weight:750;font-stretch:108%;font-variant-numeric:tabular-nums}
.ring.side b{font-size:44px}
.target{display:flex;align-items:center;gap:18px}
.target b{font-size:72px;font-weight:750;font-stretch:108%;line-height:1;min-width:2ch;text-align:center;font-variant-numeric:tabular-nums}
.target .ib{width:52px;height:52px;border-radius:26px}
.tlab{margin:-4px 0 0;font-size:14px;font-weight:650;color:var(--muted)}
.done{min-height:60px;border-radius:16px;border:0;background:var(--accent);color:#F9FBF7;font-weight:750;font-size:18px;width:100%;display:flex;align-items:center;justify-content:center;gap:8px}
.done svg{width:22px;height:22px}
.nextup{display:flex;align-items:center;gap:10px;background:var(--dark-2);border-radius:14px;padding:6px 12px 6px 6px;width:100%}
.nextup .ph{width:72px;flex:none;background:var(--dark-3);border-radius:10px}
.nextup p{margin:0;font-size:13px;color:var(--on-dark-muted)}
.nextup p b{display:block;color:var(--on-dark);font-size:16px}
.rest .fig .lb{stroke:var(--on-dark)}.rest .fig .hd{fill:var(--on-dark)}.rest .fig .gd{stroke:var(--dark-2)}.rest .fig .pr{stroke:var(--on-dark-muted)}
.rbtns{display:flex;gap:8px;width:100%}
.rbtns button{flex:1;min-height:48px;border-radius:12px;font-weight:700;border:1px solid var(--dark-3);background:transparent;color:var(--on-dark)}
.rbtns button.m{background:var(--mint);border-color:var(--mint);color:#16221B}
.pctl{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.pctl button{min-height:52px;border-radius:14px;border:1px solid var(--line);background:var(--surface);font-weight:700;display:flex;align-items:center;justify-content:center;gap:6px;font-size:14px}
.pctl button svg{width:20px;height:20px}
.pctl button:disabled{opacity:.4}
.paused{position:absolute;inset:0;display:grid;place-items:center;font-size:20px;font-weight:750;background:color-mix(in srgb, var(--surface) 70%, transparent);border-radius:50%}
.endc{display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center}
.endc .big{font-size:56px;line-height:1}
.feel{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px;width:100%}
.feel button{min-height:64px;border-radius:14px;border:1px solid var(--line);background:var(--surface);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:12px;font-weight:650;padding:4px 2px}
.feel button b{font-size:20px}
.feel button.on{background:var(--accent);border-color:var(--accent);color:#F9FBF7}

/* Progrès */
.chart{width:100%;height:auto;display:block}
.chart text{font-size:10px;fill:var(--muted);font-family:inherit}
.tests{display:flex;flex-direction:column;gap:8px}
.test{background:var(--surface);border-radius:18px;padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.test .h{display:flex;align-items:center;gap:10px}
.test .h .tx{flex:1}
.test .h b{display:block;font-size:15px}
.test .h span{font-size:13px;color:var(--muted)}
.test .sp svg{display:block;width:100%;height:36px}
.test .v{font-size:26px;font-weight:750;font-stretch:108%;text-align:right;line-height:1}
.test .v small{display:block;font-size:12px;font-weight:600;color:var(--muted)}
.tin{display:flex;gap:8px}
.tin input{flex:1;min-width:0;min-height:44px;border-radius:12px;border:1px solid var(--line);background:var(--bg);padding:0 12px}
.tin .btn{min-height:44px}
.hist{background:var(--surface);border-radius:20px;padding:4px 14px}
.hrow{border-top:1px solid var(--surface-2)}
.hrow:first-child{border-top:0}
.hrow summary{list-style:none;display:flex;align-items:center;gap:10px;min-height:60px;cursor:pointer}
.hrow summary::-webkit-details-marker{display:none}
.hrow summary .tx{flex:1;min-width:0}
.hrow summary b{display:block;font-size:15px}
.hrow summary span{font-size:13px;color:var(--muted)}
.hrow summary .f{font-size:20px}
.hrow .dd{padding:0 0 12px;font-size:14px;color:var(--soft);display:flex;flex-direction:column;gap:6px}
.hrow .dd p{margin:0}
.rec{display:flex;flex-direction:column}
.rec div{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-top:1px solid var(--surface-2);font-size:14px}
.rec div:first-child{border-top:0}
.rec b{font-variant-numeric:tabular-nums}

/* Éditeur */
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:13px;font-weight:700;color:var(--muted)}
.field input{min-height:48px;border-radius:12px;border:1px solid var(--line);background:var(--surface);padding:0 12px}
.setr{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:56px;border-top:1px solid var(--surface-2)}
.setr:first-child{border-top:0}
.setr span{font-size:15px;font-weight:600}
.mv{display:flex;flex-direction:column;gap:2px}
.mv .ib{width:30px;height:28px;border-radius:8px}
.mv .ib svg{width:16px;height:16px}

/* Feuille (dialogue) */
.scrim{position:fixed;inset:0;background:rgba(10,16,12,.45);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.scrim[hidden]{display:none}
.sheet{background:var(--bg);width:min(100%,560px);max-height:88dvh;border-radius:22px 22px 0 0;padding:14px 16px calc(16px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:12px;overflow:auto}
.sheet h3{margin:0;font-size:18px;font-weight:750}
.sheet p{margin:0;color:var(--soft)}
.sheet .btns{display:flex;flex-direction:column;gap:8px}
@media (min-width:600px){.scrim{align-items:center}.sheet{border-radius:22px}}
</style>
</head>
<body>
<header class="top" hidden>
  <button class="back" id="back" type="button"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg><span id="backlab">Accueil</span></button>
  <h1 id="title">Miguel Muscu</h1>
  <span class="side" id="side"></span>
</header>
<main id="main"></main>
<div class="scrim" id="scrim" hidden><div class="sheet" id="sheet" role="dialog" aria-modal="true"></div></div>
<div class="toast" id="toast" role="status" hidden></div>

<script>
'use strict';
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]));
const ICON = {
  play: '<svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4.5v15l12-7.5z" fill="currentColor"/></svg>',
  pause: '<svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14M16 5v14"/></svg>',
  prev: '<svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>',
  next: '<svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg>',
  check: '<svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>',
  plus: '<svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>',
  minus: '<svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14"/></svg>',

const SEG = [[1,2],[2,3],[1,4],[4,5],[5,6]]; // épaule-coude, coude-main, épaule-hanche, hanche-genou, genou-pied
function propSVG(p){
  if (!p) return '';
  if (p[0] === 'chair'){
    const [, x1, x2, y, back] = p, bx = back === 'l' ? x1 : x2;
    return '<path class="pr" d="M'+x1+' '+y+'H'+x2+'M'+(x1+4)+' '+y+'V88M'+(x2-4)+' '+y+'V88M'+bx+' '+y+'V'+(y-26)+'"/>';
  }
  const [, x1, x2, y] = p;
  return '<path class="pr" d="M'+x1+' '+y+'H'+x2+'M'+(x1+6)+' '+y+'V88M'+(x2-6)+' '+y+'V88" style="stroke-width:4"/>';
}
function fig(key, anim){
  const F = FIG[key] || FIG.planche, A = F.a, B = F.b, moving = anim !== false && B && !reduceMotion();
  const pt = (P, i) => [P[i*2], P[i*2+1]];
  const am = (attr, a, b) => '<animate attributeName="'+attr+'" values="'+a+';'+b+';'+a+'" dur="2.6s" repeatCount="indefinite" calcMode="spline" keyTimes="0;.5;1" keySplines=".45 0 .55 1;.45 0 .55 1"/>';
  let s = '<svg class="fig" viewBox="0 0 160 96" aria-hidden="true"><path class="gd" d="M2 89H158"/>' + propSVG(F.prop);
  for (const [i, j] of SEG){
    const [x1, y1] = pt(A, i), [x2, y2] = pt(A, j);
    s += '<line class="lb" x1="'+x1+'" y1="'+y1+'" x2="'+x2+'" y2="'+y2+'">';
    if (moving){ const [bx1, by1] = pt(B, i), [bx2, by2] = pt(B, j); s += am('x1', x1, bx1) + am('y1', y1, by1) + am('x2', x2, bx2) + am('y2', y2, by2); }
    s += '</line>';
  }
  const [hx, hy] = pt(A, 0);
  s += '<circle class="hd" cx="'+hx+'" cy="'+hy+'" r="6.5">' + (moving ? am('cx', hx, B[0]) + am('cy', hy, B[1]) : '') + '</circle></svg>';
  return s;
}

function audioOn(){ try { actx = actx || new (window.AudioContext || window.webkitAudioContext)(); if (actx.state === 'suspended') actx.resume(); } catch(_){} }
function beep(hi){
  if (!S.voice || !actx) return;
  try {
    const o = actx.createOscillator(), g = actx.createGain(), t = actx.currentTime;
    o.frequency.value = hi ? 1320 : 880; o.type = 'sine';
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.35, t + 0.01); g.gain.exponentialRampToValueAtTime(0.0001, t + (hi ? 0.45 : 0.16));
    o.connect(g).connect(actx.destination); o.start(t); o.stop(t + 0.5);
  } catch(_){}
}
let wake = null;
async function keepAwake(on){
  try {
    if (on && 'wakeLock' in navigator && !wake){ wake = await navigator.wakeLock.request('screen'); wake.addEventListener('release', () => { wake = null; }); }
    if (!on && wake){ await wake.release(); wake = null; }
  } catch(_){ wake = null; }
}

function weekStats(){
  const ws = weekStart(new Date()).getTime(), list = S.hist.filter(h => new Date(h.d).getTime() >= ws);
  return { n: list.length, sec: list.reduce((a, h) => a + (h.dur || 0), 0) };
}
function weekStreak(){
  const weeks = new Set(S.hist.map(h => weekStart(h.d).getTime()));
  let w = weekStart(new Date()), n = 0;
  if (!weeks.has(w.getTime())) w.setDate(w.getDate() - 7);
  while (weeks.has(w.getTime())){ n++; w.setDate(w.getDate() - 7); }
  return n;
}
function suggestion(){
  // La séance faite le moins récemment parmi les prêtes et les tiennes (la tienne d'abord à égalité).
  const last = id => { const h = S.hist.find(x => x.sid === id); return h ? new Date(h.d).getTime() : 0; };
  const pool = S.custom.filter(s => s.items.length).concat(TEMPLATES.filter(t => t.id !== 't-debut' || !S.hist.length));
  return pool.slice().sort((a, b) => last(a.id) - last(b.id))[0] || TEMPLATES[0];
}

/* ---------- Lecteur de séance ---------- */
let PL = null, tickT = 0;
function buildSteps(s){
  const steps = [], items = s.items.filter(([id]) => EX[id]);
  steps.push({ k:'prep', dur:10, nx:items[0] });
  for (let r = 0; r < s.rounds; r++){
    items.forEach(([id, v], i) => {
      steps.push({ k:'work', ex:id, v, r, i });
      const last = i === items.length - 1;
      if (!last && s.rest > 0) steps.push({ k:'rest', dur:s.rest, nx:items[i+1] });
      if (last && r < s.rounds - 1 && s.rround > 0) steps.push({ k:'rest', dur:s.rround, nx:items[0], round:true });
    });
  }
  return { steps, nItems:items.length };
}
function startPlay(s){
  stopPlay(true);
  const b = buildSteps(s);
  PL = { s, steps:b.steps, n:b.nItems, i:0, done:{}, t0:Date.now(), end:0, left:0, paused:false, ended:false, said:-1, half:false };
  audioOn(); keepAwake(true);
  setTop(s.name, { label:'Quitter', to:'s/'+s.id });
  enterStep(0);
  clearInterval(tickT); tickT = setInterval(tick, 200);
}
function stopPlay(silent){
  clearInterval(tickT); tickT = 0;
  if (PL && !PL.ended && silent && Object.keys(PL.done).length) recordSession(true);
  PL = null; keepAwake(false); if (synth) synth.cancel();
}
const curStep = () => PL && PL.steps[PL.i];
function enterStep(i){
  if (i >= PL.steps.length){ finishPlay(); return; }
  PL.i = Math.max(0, i); PL.paused = false; PL.said = -1; PL.half = false;
  const st = curStep(), ex = st.ex && EX[st.ex];
  if (st.k === 'work' && ex){
    if (ex.t === 's'){ PL.left = workSecs(ex, st.v); PL.end = Date.now() + PL.left * 1000; }
    else PL.reps = PL.done[PL.i] != null ? PL.done[PL.i] : st.v;
    say(ex.n + (ex.t === 's' ? ', ' + st.v + ' secondes' + (ex.side === 'each' ? ' de chaque côté' : '') : ', ' + st.v + (ex.side === 'each' ? ' de chaque côté' : '')));
    beep(true);
  } else {
    PL.left = st.dur; PL.end = Date.now() + st.dur * 1000;
    const nx = st.nx && EX[st.nx[0]];
    if (st.k === 'prep') say('Prépare-toi. Premier exercice : ' + (nx ? nx.n : ''));
    else say((st.round ? 'Fin du tour. ' : '') + 'Repos. Ensuite : ' + (nx ? nx.n : ''));
  }
  drawPlay();
}
function remaining(){ return PL.paused ? PL.left : Math.max(0, (PL.end - Date.now()) / 1000); }
function tick(){
  if (!PL || PL.ended) return;
  const st = curStep(); if (!st) return;
  const el = $('elapsed'); if (el) el.textContent = elapsedLab();
  const timed = st.k !== 'work' || EX[st.ex].t === 's';
  if (!timed || PL.paused) return;
  const r = remaining(), sec = Math.ceil(r);
  const b = document.querySelector('.ring b'), c = document.querySelector('.ring .fgc');
  if (b){ b.textContent = mmss(sec); }
  if (c){ const tot = st.k === 'work' ? workSecs(EX[st.ex], st.v) : st.dur; c.style.strokeDashoffset = String(301.6 * (1 - r / tot)); }
  if (st.k === 'work' && EX[st.ex].side === 'each' && !PL.half && r <= st.v){ PL.half = true; say('Change de côté'); beep(true); const sl = document.querySelector('.sidelab'); if (sl) sl.textContent = '2e côté'; }
  if (sec <= 3 && sec >= 1 && PL.said !== sec){ PL.said = sec; beep(false); }
  if (r <= 0){
    if (st.k === 'work') PL.done[PL.i] = st.v;
    enterStep(PL.i + 1);
  }
}
function elapsedLab(){ const t = (Date.now() - PL.t0) / 1000; return mmss(t) + (t < 60 ? ' s' : '') + ' écoulées'; }
function ring(sec, tot, extra){
  const off = 301.6 * (1 - sec / tot);
  return '<div class="ring'+(extra || '')+'"><svg viewBox="0 0 110 110" aria-hidden="true"><circle class="bgc" cx="55" cy="55" r="48"/><circle class="fgc" cx="55" cy="55" r="48" stroke-dasharray="301.6" style="stroke-dashoffset:'+off+'"/></svg><b>'+mmss(sec)+'</b>'+(PL.paused ? '<span class="paused">Pause</span>' : '')+'</div>';
}
function drawPlay(){
  const st = curStep(), s = PL.s, works = PL.steps.filter(x => x.k === 'work').length, wi = PL.steps.slice(0, PL.i + 1).filter(x => x.k === 'work').length;
  const r = st.k === 'work' ? st.r : (PL.steps.slice(PL.i).find(x => x.k === 'work') || { r: s.rounds - 1 }).r;
  const pos = st.k === 'work' ? st.i + 1 : (PL.steps.slice(PL.i).find(x => x.k === 'work') || { i: PL.n - 1 }).i + 1;
  let stage = '';
  if (st.k === 'work'){
    const ex = EX[st.ex];
    stage = '<div class="pstage"><p class="pkind">Exercice '+pos+' / '+PL.n+'</p><div class="ph">'+fig(ex.f)+'</div><h2 class="pname">'+esc(ex.n)+'</h2>';
    if (ex.t === 's'){
      const tot = workSecs(ex, st.v);
      stage += ring(Math.ceil(remaining()), tot, ex.side === 'each' ? ' side' : '') + '<p class="tlab">'+(ex.side === 'each' ? '<span class="sidelab">'+(PL.half ? '2e côté' : '1er côté')+'</span> · '+st.v+' s par côté' : st.v+' secondes')+'</p>'
        + '<p class="phint">'+esc(ex.c[1] || ex.c[0])+'</p></div>';
    } else {
      stage += '<div class="target"><button class="ib" data-p="r-" aria-label="Une de moins">'+ICON.minus+'</button><b>'+PL.reps+'</b><button class="ib" data-p="r+" aria-label="Une de plus">'+ICON.plus+'</button></div>'
        + '<p class="tlab">répétitions'+(ex.side === 'each' ? ' de chaque côté' : ex.side === 'alt' ? ' en alternant' : '')+(PL.reps !== st.v ? ' · objectif '+st.v : '')+'</p>'
        + '<p class="phint">'+esc(ex.c[1] || ex.c[0])+'</p>'
        + '<button class="done" data-p="done">'+ICON.check+' C’est fait</button></div>';
    }
  } else {
    const nx = st.nx && EX[st.nx[0]];
    stage = '<div class="pstage rest"><p class="pkind">'+(st.k === 'prep' ? 'Prépare-toi' : st.round ? 'Fin du tour '+(r)+' · repos' : 'Repos')+'</p>'
      + ring(Math.ceil(remaining()), st.dur)
      + (nx ? '<div class="nextup"><span class="ph">'+fig(nx.f, false)+'</span><p>À suivre'+(st.round ? ' · tour '+(r + 1)+' / '+s.rounds : '')+'<b>'+esc(nx.n)+'</b>'+valLab(nx, st.nx[1])+'</p></div>' : '')
      + '<div class="rbtns"><button data-p="add">+15 s</button><button class="m" data-p="skip">Passer</button></div></div>';
  }
  $('main').innerHTML = '<div class="play">'
    + '<div class="pmeta"><span>Tour '+(r + 1)+' / '+s.rounds+'</span><span id="elapsed">'+elapsedLab()+'</span></div>'
    + '<div class="pbar"><i style="width:'+Math.round((wi - (st.k === 'work' ? 1 : 0)) / works * 100)+'%"></i></div>'
    + stage
    + '<div class="pctl"><button data-p="prev"'+(PL.i ? '' : ' disabled')+'>'+ICON.prev+' Retour</button>'
    + '<button data-p="pause"'+(st.k === 'work' && EX[st.ex].t === 'r' ? ' disabled' : '')+'>'+(PL.paused ? ICON.play+' Reprendre' : ICON.pause+' Pause')+'</button>'
    + '<button data-p="next">Passer '+ICON.next+'</button></div></div>';
}
$('main').addEventListener('click', e => {
  if (!PL || PL.ended) return;
  const b = e.target.closest('[data-p]'); if (!b) return;
  const a = b.dataset.p, st = curStep();
  audioOn();
  if (a === 'r+'){ PL.reps = Math.min(999, PL.reps + 1); drawPlay(); }
  else if (a === 'r-'){ PL.reps = Math.max(0, PL.reps - 1); drawPlay(); }
  else if (a === 'done'){ PL.done[PL.i] = PL.reps; enterStep(PL.i + 1); }
  else if (a === 'add'){ if (PL.paused) PL.left += 15; else PL.end += 15000; st.dur += 15; drawPlay(); }
  else if (a === 'skip') enterStep(PL.i + 1);
  else if (a === 'next'){
    if (st.k === 'work' && EX[st.ex].t === 's'){ const done = Math.round(workSecs(EX[st.ex], st.v) - remaining()); if (done > 0) PL.done[PL.i] = Math.min(st.v, EX[st.ex].side === 'each' ? Math.round(done / 2) : done); }
    enterStep(PL.i + 1);
  }
  else if (a === 'prev'){ let j = PL.i - 1; while (j > 0 && PL.steps[j].k !== 'work') j--; enterStep(Math.max(0, j)); }
  else if (a === 'pause'){
    if (PL.paused){ PL.paused = false; PL.end = Date.now() + PL.left * 1000; }
    else { PL.left = remaining(); PL.paused = true; if (synth) synth.cancel(); }
    drawPlay();
  }
});
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && PL && !PL.ended) keepAwake(true); });
async function quitPlay(){
  const any = Object.keys(PL.done).length, wasPaused = PL.paused;
  const cs = curStep(), timed = cs.k !== 'work' || EX[cs.ex].t === 's';
  if (timed && !PL.paused){ PL.left = remaining(); PL.paused = true; }
  const v = await sheet('Arrêter la séance ?', any ? 'Tu as déjà fait '+Object.keys(PL.done).length+' exercice'+(any > 1 ? 's' : '')+'.' : '',
    any ? [{ label:'Enregistrer ce qui est fait', v:'save', cls:'primary' }, { label:'Arrêter sans enregistrer', v:'drop', cls:'danger' }, { label:'Continuer la séance', v:'go' }]
        : [{ label:'Arrêter', v:'drop', cls:'danger' }, { label:'Continuer la séance', v:'go' }]);
  if (!PL) return;
  if (v === 'save'){ const h = recordSession(true); PL.ended = true; const sid = PL.s.id; stopPlay(false); go('prog'); toast('Séance enregistrée ('+h.sets.length+' exercices).'); return; }
  if (v === 'drop'){ PL.ended = true; const sid = PL.s.id; stopPlay(false); go('s/'+sid); return; }
  if (timed && !wasPaused){ PL.paused = false; PL.end = Date.now() + PL.left * 1000; }
  drawPlay();
}
function recordSession(partial){
  const sets = Object.keys(PL.done).map(Number).sort((a, b) => a - b).map(i => ({ ex: PL.steps[i].ex, v: PL.done[i], t: PL.steps[i].v }));
  const h = { id:'h-'+Date.now().toString(36), d:new Date(PL.t0).toISOString(), sid:PL.s.id, name:PL.s.name, dur:Math.round((Date.now() - PL.t0) / 1000), sets, partial: partial || undefined, feel:null };
  S.hist.unshift(h); save(); PL.rec = h; return h;
}
function finishPlay(){
  PL.ended = true; clearInterval(tickT); tickT = 0; keepAwake(false);
  const h = recordSession(false), reps = h.sets.filter(x => EX[x.ex].t === 'r').reduce((a, x) => a + x.v, 0), secs = h.sets.filter(x => EX[x.ex].t === 's').reduce((a, x) => a + x.v * (EX[x.ex].side === 'each' ? 2 : 1), 0);
  say('Bravo, séance terminée !'); beep(true);
  setTop(PL.s.name, { label:'Accueil', to:'' });
  $('main').innerHTML = '<div class="play"><div class="pstage endc"><span class="big" aria-hidden="true">💪</span><h2 class="pname">Séance terminée</h2>'
    + '<div class="facts" style="justify-content:center"><span>'+minutes(h.dur)+'</span><span>'+h.sets.length+' série'+(h.sets.length > 1 ? 's' : '')+'</span>'+(reps ? '<span>'+reps+' répétitions</span>' : '')+(secs ? '<span>'+mmss(secs)+(secs < 60 ? ' s' : '')+' de gainage</span>' : '')+'</div>'
    + '<p class="phint" style="margin-top:8px">Comment c’était ?</p>'
    + '<div class="feel" id="feel">'+FEEL.map(([e, l], i) => '<button data-f="'+(i+1)+'"><b>'+e+'</b>'+l+'</button>').join('')+'</div></div>'
    + '<button class="btn primary" data-go="prog">Voir mes progrès</button><button class="btn" data-go="">Accueil</button></div>';
  $('feel').onclick = e => { const b = e.target.closest('[data-f]'); if (!b) return; h.feel = +b.dataset.f; save(); for (const x of $('feel').children) x.classList.toggle('on', x === b); toast('Noté, merci.'); };
  PL = null;
}

/* ---------- Progrès ---------- */
function weeksChart(){
  const n = 10, start = weekStart(new Date()); start.setDate(start.getDate() - 7 * (n - 1));
  const counts = Array(n).fill(0), mins = Array(n).fill(0);
  for (const h of S.hist){ const k = Math.round((weekStart(h.d) - start) / 6048e5); if (k >= 0 && k < n){ counts[k]++; mins[k] += (h.dur || 0) / 60; } }
  const max = Math.max(3, ...counts), W = 320, H = 130, bw = 22, gap = (W - 20 - n * bw) / (n - 1);
  let s = '<svg class="chart" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Séances par semaine sur 10 semaines">';
  for (let i = 0; i < n; i++){
    const x = 10 + i * (bw + gap), h = counts[i] / max * 86, y = 100 - h, d = new Date(start); d.setDate(d.getDate() + 7 * i);
    s += '<rect x="'+x+'" y="'+(counts[i] ? y : 98)+'" width="'+bw+'" height="'+(counts[i] ? h : 2)+'" rx="4" fill="'+(i === n - 1 ? 'var(--accent)' : 'var(--mint)')+'"/>';
    if (counts[i]) s += '<text x="'+(x + bw/2)+'" y="'+(y - 4)+'" text-anchor="middle" style="font-weight:700;fill:var(--ink)">'+counts[i]+'</text>';
    s += '<text x="'+(x + bw/2)+'" y="116" text-anchor="middle">'+d.getDate()+'/'+(d.getMonth()+1)+'</text>';
  }
  return s + '</svg>';
}
function spark(vals){
  if (vals.length < 2) return '';
  const W = 300, H = 36, mx = Math.max(...vals), mn = Math.min(...vals), sp = mx - mn || 1;
  const pts = vals.map((v, i) => (i / (vals.length - 1) * (W - 6) + 3).toFixed(1)+','+(H - 4 - (v - mn) / sp * (H - 8)).toFixed(1)).join(' ');
  return '<svg viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="none" aria-hidden="true"><polyline points="'+pts+'" fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/></svg>';
}
function renderProgress(){
  setTop('Progrès', { label:'Accueil', to:'' });
  const month = new Date(); month.setDate(1); month.setHours(0,0,0,0);
  const mlist = S.hist.filter(h => new Date(h.d) >= month), w = weekStats();
  const recs = Object.values(EX).map(x => [x, bestOf(x.id)]).filter(([, b]) => b).sort((a, b) => a[0].n.localeCompare(b[0].n, 'fr'));
  $('main').innerHTML =
    '<div class="stats"><div class="stat"><b>'+w.n+'</b><span>cette semaine</span></div><div class="stat"><b>'+mlist.length+'</b><span>ce mois-ci</span></div><div class="stat"><b>'+Math.round(mlist.reduce((a, h) => a + (h.dur || 0), 0) / 60)+'</b><span>minutes ce mois</span></div></div>'
    + '<div class="card"><h2>Séances par semaine</h2>'+weeksChart()+'</div>'
    + '<h2 class="sec">Tests<small>refais-les toutes les 2 à 4 semaines</small></h2>'
    + '<div class="tests">'+TESTS.map(t => {
        const L = (S.tests[t.id] || []), last = L[L.length - 1], best = L.reduce((a, x) => Math.max(a, x.v), 0);
        return '<div class="test"><div class="h"><span class="tx"><b>'+esc(t.n)+'</b><span>'+esc(t.d)+'</span></span>'
          + '<span class="v">'+(last ? last.v+' '+t.u : '–')+'<small>'+(last ? 'record '+best+' '+t.u : 'pas encore fait')+'</small></span></div>'+(L.length > 1 ? '<div class="sp">'+spark(L.slice(-8).map(x => x.v))+'</div>' : '')
          + '<form class="tin" data-t="'+t.id+'"><input type="number" inputmode="numeric" min="1" max="999" placeholder="Résultat du jour ('+t.u+')" aria-label="Résultat '+esc(t.n)+'"><button class="btn primary">Noter</button></form></div>';
      }).join('')+'</div>'
    + (recs.length ? '<h2 class="sec">Records en séance</h2><div class="card rec">'+recs.map(([x, b]) => '<div><span>'+esc(x.n)+'</span><b>'+(x.t === 's' ? b+' s' : b+' rép.')+'</b></div>').join('')+'</div>' : '')
    + '<h2 class="sec">Historique<small>'+S.hist.length+'</small></h2>'
    + (S.hist.length ? '<div class="hist">'+S.hist.slice(0, 60).map(h => '<details class="hrow"><summary><span class="tx"><b>'+esc(h.name)+(h.partial ? ' <span class="pill">partielle</span>' : '')+'</b><span>'+esc(DFMT.format(new Date(h.d)))+' · '+minutes(h.dur)+' · '+h.sets.length+' série'+(h.sets.length > 1 ? 's' : '')+'</span></span>'+(h.feel ? '<span class="f" title="'+FEEL[h.feel-1][1]+'">'+FEEL[h.feel-1][0]+'</span>' : '')+'</summary>'
        + '<div class="dd">'+summarize(h).map(t => '<p>'+t+'</p>').join('')+'<button class="btn danger" data-delh="'+h.id+'">'+ICON.trash+' Supprimer cette séance</button></div></details>').join('')+'</div>'
      : '<div class="empty">Aucune séance enregistrée pour l’instant.</div>')
    + '<div class="row2"><button class="btn" id="expbtn">Sauvegarder (fichier)</button><button class="btn" id="impbtn">Restaurer</button></div>'
    + '<p class="sub" style="font-size:13px">Tes séances et ton suivi sont gardés sur cet appareil. Pense à sauvegarder de temps en temps.</p>'
    + '<input type="file" id="impfile" accept="application/json,.json" hidden>';
  for (const f of document.querySelectorAll('.tin')) f.onsubmit = e => {
    e.preventDefault(); const v = parseInt(f.querySelector('input').value, 10);
    if (!(v > 0)){ toast('Entre un nombre.'); return; }
    (S.tests[f.dataset.t] = S.tests[f.dataset.t] || []).push({ d:new Date().toISOString(), v }); save();
    const t = TESTS.find(x => x.id === f.dataset.t), L = S.tests[f.dataset.t], prev = L.length > 1 ? Math.max(...L.slice(0, -1).map(x => x.v)) : 0;
    toast(prev && v > prev ? 'Nouveau record : '+v+' '+t.u+' !' : 'Noté : '+v+' '+t.u+'.'); renderProgress();
  };
  $('main').querySelector('.hist') && ($('main').querySelector('.hist').onclick = async e => {
    const b = e.target.closest('[data-delh]'); if (!b) return;
    if (await sheet('Supprimer cette séance de l’historique ?', '', [{ label:'Supprimer', v:1, cls:'danger' }, { label:'Annuler', v:0 }])){ S.hist = S.hist.filter(h => h.id !== b.dataset.delh); save(); renderProgress(); }
  });
  $('expbtn').onclick = exportData;
  $('impbtn').onclick = () => $('impfile').click();
  $('impfile').onchange = importData;
}
function summarize(h){
  const by = {};
  for (const st of h.sets){ (by[st.ex] = by[st.ex] || []).push(st.v); }
  return Object.entries(by).map(([id, vs]) => EX[id] ? '<b>'+esc(EX[id].n)+'</b> : '+vs.join(' · ')+(EX[id].t === 's' ? ' s' : ' rép.') : '');
}
function exportData(){
  const blob = new Blob([JSON.stringify({ app:'miguel-muscu', v:1, date:new Date().toISOString(), data:S }, null, 1)], { type:'application/json' });
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'miguel-muscu-'+dayKey(new Date())+'.json';
  document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
}
async function importData(e){
  const f = e.target.files && e.target.files[0]; if (!f) return;
  try {
    const j = JSON.parse(await f.text()), d = j && j.data;
    if (!d || !Array.isArray(d.hist)) throw 0;
    if (!await sheet('Restaurer cette sauvegarde ?', 'Elle remplace les séances perso, l’historique et les tests de cet appareil.', [{ label:'Restaurer', v:1, cls:'primary' }, { label:'Annuler', v:0 }])) return;
    localStorage.setItem(KEY, JSON.stringify(d)); S = load(); toast('Sauvegarde restaurée.'); renderProgress();
  } catch(_){ toast('Ce fichier n’est pas une sauvegarde Miguel Muscu.'); }
  e.target.value = '';
}

render(location.hash.slice(1));
</script>
</body>
</html>
